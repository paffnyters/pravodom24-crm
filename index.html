function header(title,button=''){return `<div class="top"><div><h1>${title}</h1></div><div class="actions">${button}</div></div>`}
function searchBar(){return `<input class="search" placeholder="Поиск" value="${esc(state.search)}" oninput="state.search=this.value;render()">`}
function render(){const main=document.getElementById('main');if(!main)return;if(state.view==='today')renderToday(main);else if(state.view==='sales')renderSales(main);else if(state.view==='legal')renderLegal(main);else if(state.view==='clients')renderClients(main);else if(state.view==='tasks')renderTasks(main);else renderSettings(main)}
function renderToday(main){const overdue=overdueTasks(),today=todayPending();let body=header('Сегодня',`<button class="btn primary" onclick="newTask('${todayKey()}')">+ Задача</button>`);if(today.length===1)body+=`<div class="today-banner">Есть 1 невыполненная задача сегодня</div>`;else if(today.length>1)body+=`<div class="today-banner">Есть ${today.length} невыполненных задач сегодня</div>`;else body+=`<div class="card"><div class="card-title">На сегодня всё спокойно</div><div class="card-sub">Невыполненных задач на сегодня нет.</div></div>`;if(overdue.length)body+=`<div class="section"><h3>Просрочено</h3>${taskListHtml(overdue)}</div>`;if(today.length)body+=`<div class="section"><h3>Сегодня</h3>${taskListHtml(today)}</div>`;main.innerHTML=body}
function renderSales(main){const p=pipelineFor('organization')[0],stages=stagesFor(p?.id);main.innerHTML=header('Продажи',`<button class="btn primary" onclick="newOrg()">Добавить</button>`)+`<div class="toolbar">${searchBar()}<button class="btn small" onclick="openProfitSummary()">Прибыль</button></div><div class="board">${stages.map(s=>`<section class="column"><div class="column-head"><span class="column-title">${esc(s.name)}</span><span class="count">${state.orgs.filter(o=>o.sales_stage_id===s.id&&matchOrg(o)).length}</span></div>${state.orgs.filter(o=>o.sales_stage_id===s.id&&matchOrg(o)).map(orgCard).join('')||'<div class="empty">Пусто</div>'}</section>`).join('')||'<div class="empty">Воронка «Продажи» не настроена.</div>'}</div>`}
function matchOrg(o){const q=state.search.toLowerCase();return !q||[o.name,o.contact_name,o.phone,o.email,o.inn].filter(Boolean).some(x=>String(x).toLowerCase().includes(q))}
function orgCostHtml(o){if(o.service_cost_unknown!==false)return '<span class="chip">услуги: ?</span>';if(o.service_cost!==null&&o.service_cost!==undefined&&o.service_cost!=='')return `<span class="chip">услуги: ${fmtMoney(o.service_cost)}</span>`;return ''}
function orgCard(o){return `<article class="card" onclick="openOrg('${o.id}')"><div class="card-title">${esc(o.name)}</div>${o.contact_name?`<div class="card-sub">${esc(o.contact_name)}</div>`:''}<div class="meta"><span class="chip">${esc(SOURCE_LABEL[o.source||'not_set'])}</span>${orgCostHtml(o)}</div>${o.phone?`<div class="card-sub" style="margin-top:9px">${esc(o.phone)}</div>`:''}<button class="btn card-action" onclick="event.stopPropagation();openOrg('${o.id}')">Открыть</button></article>`}
function renderLegal(main){const ps=pipelineFor('case');if(!state.legalPipelineView&&ps[0])state.legalPipelineView=ps[0].id;const selected=state.legalPipelineView==='all'?null:ps.find(p=>p.id===state.legalPipelineView)||ps[0];const tabs=ps.map(p=>`<button class="btn pipeline-tab ${selected?.id===p.id?'active':''}" onclick="selectLegalPipeline('${p.id}')">${esc(p.name)}</button>`).join('');const allTab=`<button class="btn pipeline-tab ${state.legalPipelineView==='all'?'active':''}" onclick="selectLegalPipeline('all')">Все воронки</button>`;main.innerHTML=header('Юридическая работа',`<button class="btn" onclick="newLegalPipeline()">+ Воронка</button><button class="btn primary" onclick="newCase()">+ Дело</button>`)+`<div class="pipeline-switch">${tabs}${allTab}</div>${selected?legalPipelineHtml(selected):ps.map(legalPipelineHtml).join('')}`;if(!ps.length)main.innerHTML+=`<div class="card"><div class="card-title">Юридических воронок пока нет</div><div class="card-sub">Создайте первую воронку под свой процесс.</div><button class="btn primary" style="margin-top:12px" onclick="newLegalPipeline()">Создать первую воронку</button></div>`}
function selectLegalPipeline(id){state.legalPipelineView=id;state.search='';render()}
function legalPipelineHtml(p){const stages=stagesFor(p.id),total=state.cases.filter(c=>c.legal_pipeline_id===p.id).length;const selectMode=state.groupSelectMode&&state.legalPipelineView===p.id;return `<section style="margin-bottom:22px"><div class="toolbar"><div><h2 style="margin:0;font-size:17px">${esc(p.name)}</h2><div class="card-sub">${total} дел</div></div><div class="actions">${selectMode?`<span class="group-note">Выбрано: ${state.groupSelected.size}</span><button class="btn primary small" onclick="createGroupFromSelection()">Создать группу</button><button class="btn small" onclick="cancelGroupSelection()">Отмена</button>`:`<button class="btn small" onclick="startGroupSelection('${p.id}')">Создать группу</button>`}<button class="btn small" onclick="renamePipeline('${p.id}')">Переименовать</button><button class="btn danger small" onclick="deletePipeline('${p.id}')">Удалить</button></div></div><div class="board">${stages.map(s=>{const cs=state.cases.filter(c=>c.legal_stage_id===s.id&&matchCase(c));return `<section class="column"><div class="column-head"><div><div class="column-title">${esc(s.name)}</div><div class="actions" style="margin-top:5px"><button class="btn small" onclick="renameStage('${s.id}')">Изменить</button><button class="btn danger small" onclick="deleteStage('${s.id}')">Удалить</button></div></div><span class="count">${cs.length}</span></div>${groupedCards(cs)}</section>`}).join('')}</div><div class="actions" style="margin-top:7px"><button class="btn small" onclick="newStage('${p.id}')">+ Колонка</button></div></section>`}
function profitSummaryAll(){const sums={mailing:0,dmitry_base:0,not_set:0};state.cases.filter(c=>isProfitVisible(c)).forEach(c=>sums[c.source||'not_set']+=Number(c.profit)||0);return `<div class="profit-summary compact"><div class="profit-item"><span class="card-sub">рассылки</span><strong>${fmtMoney(sums.mailing)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">база Дмитрия</span><strong>${fmtMoney(sums.dmitry_base)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">не установлено</span><strong>${fmtMoney(sums.not_set)||'0 ₽'}</strong></div></div>`}
function openProfitSummary(){const sums={mailing:0,dmitry_base:0,not_set:0};state.cases.filter(isProfitVisible).forEach(c=>sums[c.source||'not_set']+=Number(c.profit)||0);modal(`<div class="modal-head"><div><h2>Прибыль</h2><div class="card-sub">Только дела на стадии «Оплата получена» или позднее.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="profit-summary" style="margin-top:18px"><div class="profit-item"><span class="card-sub">с рассылок</span><strong>${fmtMoney(sums.mailing)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">база клиентов Дмитрия</span><strong>${fmtMoney(sums.dmitry_base)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">не установлено</span><strong>${fmtMoney(sums.not_set)||'0 ₽'}</strong></div></div>`)}
function isProfitVisible(c){if(c.profit===null||c.profit===undefined)return false;const p=state.pipelines.find(x=>x.id===c.legal_pipeline_id);const pay=stagesFor(p?.id).find(s=>s.name.trim().toLowerCase()==='оплата получена');const stage=state.stages.find(s=>s.id===c.legal_stage_id);return !!pay&&!!stage&&stage.pipeline_id===p.id&&stage.sort_order>=pay.sort_order}
function groupColor(g){return g?.color||GROUP_COLORS[Math.abs(hashCode(g?.id||''))%GROUP_COLORS.length]}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h}
function groupedCards(cs){const groups={},ungrouped=[];cs.forEach(c=>c.group_id?(groups[c.group_id]??=[]).push(c):ungrouped.push(c));let html='';Object.entries(groups).sort((a,b)=>String(a[1][0].created_at).localeCompare(String(b[1][0].created_at))).forEach(([gid,items])=>{const g=state.groups.find(x=>x.id===gid);html+=`<div class="group" style="--group-color:${groupColor(g)}"><div class="group-head"><div class="group-label"><span class="group-dot"></span><strong>${esc(g?.name||'Группа')}</strong></div><button class="btn small" onclick="event.stopPropagation();openGroup('${gid}')">Группа</button></div><div class="group-grid">${items.map(caseCard).join('')}</div></div>`});html+=ungrouped.map(caseCard).join('');return html||'<div class="empty">Пусто</div>'}
function matchCase(c){const q=state.search.toLowerCase();return !q||[c.title,c.debtor_name,c.debtor_identifier].filter(Boolean).some(x=>String(x).toLowerCase().includes(q))}
function caseCard(c){const selected=state.groupSelected.has(c.id);const selectable=state.groupSelectMode&&!c.group_id;return `<article class="card ${selectable?'selectable':''} ${selected?'selected-for-group':''}" onclick="${selectable?`toggleGroupCase('${c.id}')`:`openCase('${c.id}')`}">${selectable?`<input class="select-check" type="checkbox" ${selected?'checked':''} onclick="event.stopPropagation();toggleGroupCase('${c.id}')">`:''}<div class="card-title">${esc(c.title)}</div>${c.debtor_name?`<div class="card-sub">${esc(c.debtor_name)}</div>`:''}<div class="meta"><span class="chip">${esc(SOURCE_LABEL[c.source||'not_set'])}</span>${c.organization_id?`<span class="chip">${esc(state.orgs.find(o=>o.id===c.organization_id)?.name||'организация')}</span>`:''}</div>${!selectable?`<button class="btn card-action" onclick="event.stopPropagation();openCase('${c.id}')">Открыть</button>`:''}</article>`}
function renderClients(main){main.innerHTML=header('Клиенты',`<button class="btn primary" onclick="newOrg()">Добавить</button>`)+`<div class="toolbar">${searchBar()}</div><div class="list">${state.orgs.filter(matchOrg).map(o=>`<div class="row" onclick="openOrg('${o.id}')"><div><strong>${esc(o.name)}</strong><div class="card-sub">${esc(SOURCE_LABEL[o.source||'not_set'])} · ${o.service_cost_unknown!==false?'стоимость ?':fmtMoney(o.service_cost)}</div></div><button class="btn" onclick="event.stopPropagation();openOrg('${o.id}')">Открыть</button></div>`).join('')||'<div class="empty">Ничего не найдено</div>'}</div>`}
function taskListHtml(tasks){return `<div class="task-list">${tasks.sort((a,b)=>(a.due_time||'99:99').localeCompare(b.due_time||'99:99')).map(taskHtml).join('')}</div>`}
function taskHtml(t){const org=t.organization_id?state.orgs.find(o=>o.id===t.organization_id):null,cas=t.case_id?state.cases.find(c=>c.id===t.case_id):null;const overdue=!t.completed&&t.due_date<todayKey();return `<div class="task ${t.completed?'done':''}"><input class="task-check" type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta ${overdue?'task-overdue':''}">${t.due_date?fmtDate(t.due_date):'Без даты'}${t.due_time?' · '+esc(t.due_time.slice(0,5)):''}${org?' · '+esc(org.name):''}${cas?' · '+esc(cas.title):''}</div>${t.notes?`<div class="card-sub">${esc(t.notes)}</div>`:''}</div><div class="task-actions"><button class="btn small" onclick="editTask('${t.id}')">Изменить</button></div></div>`}
function renderTasks(main){const now=state.calendarMonth||new Date(todayKey()+'T00:00:00'),y=now.getFullYear(),m=now.getMonth();if(!state.taskDate)state.taskDate=todayKey();const days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),offset=(first+6)%7;let cells='';for(let i=0;i<offset;i++)cells+=`<div></div>`;for(let d=1;d<=days;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,count=state.tasks.filter(t=>t.due_date===k).length;cells+=`<button class="day ${k===state.taskDate?'selected':''} ${k===todayKey()?'today':''}" onclick="selectTaskDate('${k}')"><div class="day-num">${d}</div>${count?`<div class="day-count">${count} ${count===1?'задача':count<5?'задачи':'задач'}</div>`:''}</button>`}const selectedTasks=state.tasks.filter(t=>t.due_date===state.taskDate);main.innerHTML=header('Задачи',`<button class="btn primary" onclick="newTask('${state.taskDate}')">+ Задача</button>`)+`<div class="calendar"><div class="calendar-head"><button class="btn small" onclick="shiftMonth(-1)">‹</button><strong>${now.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</strong><button class="btn small" onclick="shiftMonth(1)">›</button></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div><div class="section"><h3>${fmtDate(state.taskDate)}</h3>${selectedTasks.length?taskListHtml(selectedTasks):'<div class="empty">На эту дату задач нет.</div>'}</div>`}
function selectTaskDate(k){state.taskDate=k;state.calendarMonth=parseDate(k);render()}
function shiftMonth(delta){const d=state.calendarMonth||parseDate(state.taskDate||todayKey());state.calendarMonth=new Date(d.getFullYear(),d.getMonth()+delta,1);render()}
function renderSettings(main){main.innerHTML=header('Настройки')+`<div class="settings-grid"><section class="card settings-card"><div class="card-title">Тема CRM</div><div class="card-sub">Выберите внешний вид Праводом.рф.</div><select style="max-width:280px;margin-top:12px" onchange="state.theme=this.value;applyTheme();render()"><option value="system" ${state.theme==='system'?'selected':''}>⚙️ Тема системы</option><option value="light" ${state.theme==='light'?'selected':''}>☀️ Дневная</option><option value="dark" ${state.theme==='dark'?'selected':''}>🌙 Ночная</option></select></section><section class="card settings-card"><div class="card-title">Шаблоны</div><div class="card-sub">Перенос данных из одной или нескольких карточек в шаблонные документы.</div><button class="btn" style="margin-top:10px" onclick="toast('Функция «Создать шаблон» — в разработке')">Создать шаблон</button></section><section class="card settings-card"><div class="card-title">Версия</div><div class="card-sub">Праводом.рф · CRM v2.3</div></section></div>`}
async function reload(){try{const [{data:p,error:pe},{data:s,error:se},{data:o,error:oe},{data:c,error:ce},{data:g,error:ge},{data:t,error:te},{data:a,error:ae}]=await Promise.all([sb.from('crm_pipelines').select('*').eq('active',true).order('sort_order'),sb.from('crm_pipeline_stages').select('*').eq('active',true).order('sort_order'),sb.from('crm_organizations').select('*').is('deleted_at',null).order('created_at',{ascending:false}),sb.from('crm_cases').select('*').is('deleted_at',null).order('created_at',{ascending:false}),sb.from('crm_case_groups').select('*').order('created_at',{ascending:false}),sb.from('crm_tasks').select('*').order('due_date').order('due_time'),sb.from('crm_activities').select('*').eq('kind','comment').order('created_at',{ascending:false})]);for(const e of [pe,se,oe,ce,ge,te,ae])if(e)throw e;state.pipelines=p||[];state.stages=s||[];state.orgs=o||[];state.cases=c||[];state.groups=g||[];state.tasks=t||[];state.comments=a||[];await assignMissingGroupColors();shell()}catch(e){console.error(e);showFatal(e)}}
async function assignMissingGroupColors(){if(groupColorSaving)return;const missing=state.groups.filter(g=>!g.color);if(!missing.length)return;groupColorSaving=true;try{const used=new Set(state.groups.map(g=>g.color).filter(Boolean));for(const g of missing){const color=GROUP_COLORS.find(c=>!used.has(c));if(!color)break;const {error}=await sb.from('crm_case_groups').update({color}).eq('id',g.id);if(!error){g.color=color;used.add(color)}}}finally{groupColorSaving=false}}
function showFatal(e){document.getElementById('root').innerHTML=`<div class="fatal"><div class="card"><h2>Праводом.рф не удалось загрузить</h2><div class="card-sub" style="margin-top:8px">CRM остановилась при загрузке данных. Ничего не отключаем и не меняем автоматически.</div><div class="section"><strong>Техническая ошибка</strong><pre style="white-space:pre-wrap;color:var(--danger)">${esc(e?.message||e)}</pre></div><button class="btn primary" onclick="location.reload()">Обновить</button></div></div>`}
function modal(html){document.querySelector('.overlay')?.remove();const d=document.createElement('div');d.className='overlay show';d.innerHTML=`<div class="modal">${html}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}
function closeModal(){document.querySelector('.overlay')?.remove()}
function sourceButtons(current='not_set',containerId=''){return `<div class="soft-select" id="${containerId||''}"><button type="button" class="soft-select-button" onclick="toggleSoftSelect(this)"><span>${esc(SOURCE_LABEL[current]||SOURCE_LABEL.not_set)}</span><span>⌄</span></button><div class="soft-select-menu">${Object.entries(SOURCE_LABEL).map(([k,v])=>`<button type="button" class="soft-select-option ${current===k?'active':''}" onclick="chooseSource(this,'${k}')">${esc(v)}</button>`).join('')}</div><input type="hidden" class="source-value" value="${esc(current)}"></div>`}
function toggleSoftSelect(btn){const box=btn.closest('.soft-select');document.querySelectorAll('.soft-select.open').forEach(x=>{if(x!==box)x.classList.remove('open')});box.classList.toggle('open')}
function chooseSource(btn,value){const box=btn.closest('.soft-select');box.querySelector('.source-value').value=value;box.querySelector('.soft-select-button span').textContent=SOURCE_LABEL[value]||SOURCE_LABEL.not_set;box.querySelectorAll('.soft-select-option').forEach(x=>x.classList.remove('active'));btn.classList.add('active');box.classList.remove('open')}
function sourceReadOnly(value='not_set'){return `<span class="pill-value"><span class="pill-dot"></span>${esc(SOURCE_LABEL[value]||SOURCE_LABEL.not_set)}</span>`}
function stagePicker(stages,current){return `<div class="soft-select"><button type="button" class="soft-select-button" onclick="toggleSoftSelect(this)"><span>${esc(stages.find(s=>s.id===current)?.name||'Выбрать стадию')}</span><span>⌄</span></button><div class="soft-select-menu">${stages.map(s=>`<button type="button" class="soft-select-option ${s.id===current?'active':''}" onclick="chooseStage(this,'${s.id}')">${esc(s.name)}</button>`).join('')}</div><input type="hidden" class="stage-value" value="${esc(current||'')}"></div>`}
function chooseStage(btn,value){const box=btn.closest('.soft-select');box.querySelector('.stage-value').value=value;box.querySelector('.soft-select-button span').textContent=btn.textContent;box.querySelectorAll('.soft-select-option').forEach(x=>x.classList.remove('active'));btn.classList.add('active');box.classList.remove('open')}
function stageReadOnly(stages,current){return `<span class="pill-value">${esc(stages.find(s=>s.id===current)?.name||'Стадия не указана')}</span>`}
function costFields(value,unknown){return `<div class="field full"><label>Стоимость услуг</label><div class="checkline"><input id="costUnknown" type="checkbox" ${unknown!==false?'checked':''} onchange="document.getElementById('costInput').disabled=this.checked;document.getElementById('costInput').value=this.checked?'':document.getElementById('costInput').value"><span>Неизвестно</span></div><input id="costInput" name="service_cost" type="number" step="0.01" placeholder="Например, 150 000" value="${esc(value??'')}" ${unknown!==false?'disabled':''} style="margin-top:6px" oninput="if(this.value){document.getElementById('costUnknown').checked=false;this.disabled=false}"></div>`}
function readCost(){const unknown=document.getElementById('costUnknown')?.checked!==false;const input=document.getElementById('costInput');return {service_cost_unknown:unknown,service_cost:unknown||!input?.value?null:Number(input.value)}}
function newOrg(){modal(`<div class="modal-head"><div><h2>Новая организация</h2><div class="card-sub">Минимум данных сейчас. Остальное можно добавить позже.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="orgForm" class="grid" style="margin-top:16px"><div class="field full"><label>Название организации</label><input name="name" required></div><div class="field"><label>Контакт</label><input name="contact_name"></div><div class="field"><label>Телефон</label><input name="phone"></div><div class="field"><label>Email</label><input name="email"></div><div class="field"><label>ИНН</label><input name="inn"></div>${costFields('',true)}<div class="field full"><label>Источник</label><div id="orgSource" data-value="not_set">${sourceButtons()}</div></div><div class="field full"><label>Заметка</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary">Создать</button></div></form>`);document.getElementById('orgForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p=pipelineFor('organization')[0],s=stagesFor(p?.id)[0],cost=readCost();const {error}=await sb.from('crm_organizations').insert({name:f.get('name'),contact_name:f.get('contact_name')||null,phone:f.get('phone')||null,email:f.get('email')||null,inn:f.get('inn')||null,notes:f.get('notes')||null,source:document.getElementById('orgSource').dataset.value,owner_id:state.user.id,sales_pipeline_id:p?.id||null,sales_stage_id:s?.id||null,...cost});if(error)toast(error.message);else{closeModal();await reload();toast('Организация создана')}}}
function commentsHtml(type,id){const rows=(state.comments||[]).filter(x=>type==='org'?x.organization_id===id:x.case_id===id);return `<div class="comment-compose-wrap"><textarea id="newComment" class="comment-compose" placeholder="Написать комментарий..."></textarea><button class="btn comment-save" onclick="addComment('${type}','${id}')">Сохранить</button></div><div class="comment-list">${rows.map(x=>`<div class="comment-item"><div class="comment-text">${esc(x.text)}</div><div class="comment-foot"><span>${fmtDateTime(x.created_at)}</span><button class="comment-delete" onclick="deleteComment('${x.id}')">× удалить</button></div></div>`).join('')}</div>`}
async function addComment(type,id){const el=document.getElementById('newComment'),text=el?.value.trim();if(!text)return;const payload={text,kind:'comment',created_by:state.user.id};if(type==='org')payload.organization_id=id;else payload.case_id=id;const {error}=await sb.from('crm_activities').insert(payload);if(error)toast(error.message);else{await reload();type==='org'?openOrg(id):openCase(id);toast('Комментарий сохранён')}}
async function deleteComment(id){if(!confirm('Удалить комментарий?'))return;const {error}=await sb.from('crm_activities').delete().eq('id',id);if(error)toast(error.message);else{await reload();toast('Комментарий удалён')}}
async function deleteOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;if(!confirm(`Удалить карточку «${o.name}»?`))return;const {error}=await sb.from('crm_organizations').update({deleted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{closeModal();await reload();toast('Карточка удалена')}}
async function deleteCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;if(!confirm(`Удалить дело «${c.title}»?`))return;const {error}=await sb.from('crm_cases').update({deleted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{closeModal();await reload();toast('Карточка удалена')}}
function orgFieldView(label,value){return `<div class="field"><div class="edit-field-label">${label}</div><div class="card-view-value ${value?'':'muted'}">${value?esc(value):'Не указано'}</div></div>`}
function caseFieldView(label,value){return `<div class="field"><div class="edit-field-label">${label}</div><div class="card-view-value ${value?'':'muted'}">${value?esc(value):'Не указано'}</div></div>`}
function openOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;const stages=stagesFor(o.sales_pipeline_id),orgCases=state.cases.filter(c=>c.organization_id===id);modal(`<div class="modal-head"><div><h2>${esc(o.name)}</h2><div class="card-sub">${o.contact_name?esc(o.contact_name):'Контакт не указан'}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="detail-layout modal-card-layout" style="margin-top:14px"><div><div class="section" style="margin-top:0;padding-top:0;border-top:0"><h3>Продажи</h3>${stageReadOnly(stages,o.sales_stage_id)}</div><div class="section"><h3>Источник</h3>${sourceReadOnly(o.source||'not_set')}</div><div class="section"><h3>Стоимость услуг</h3><div class="card-view-value ${o.service_cost_unknown!==false?'muted':''}">${o.service_cost_unknown!==false?'?':fmtMoney(o.service_cost)}</div></div>${o.phone||o.email||o.inn||o.telegram||o.website?`<div class="section"><h3>Контакты</h3><div class="list">${o.phone?orgFieldView('Телефон',o.phone):''}${o.email?orgFieldView('Email',o.email):''}${o.telegram?orgFieldView('Telegram',o.telegram):''}${o.website?orgFieldView('Сайт',o.website):''}${o.inn?orgFieldView('ИНН',o.inn):''}</div></div>`:''}${o.position?`<div class="section">${orgFieldView('Должность',o.position)}</div>`:''}${o.max_contact?`<div class="section">${orgFieldView('Дополнительный контакт',o.max_contact)}</div>`:''}${orgCases.length?`<div class="section"><h3>Дела</h3><div class="multi">${orgCases.map(c=>`<button class="btn small" onclick="openCase('${c.id}')">${esc(c.title)}</button>`).join('')}</div></div>`:''}${o.notes?`<div class="section">${orgFieldView('Заметка',o.notes)}</div>`:''}<div class="section"><div class="actions"><button class="btn" onclick="newTask('${todayKey()}','${id}')">Задача</button><button class="btn" onclick="editOrg('${id}')">Редактировать</button></div></div><div class="delete-row"><button class="btn danger small" onclick="deleteOrg('${id}')">Удалить карточку</button></div></div><div class="detail-side"><h3 style="margin-top:0">Комментарии</h3>${commentsHtml('org',id)}</div></div>`)}
function openCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;const stages=stagesFor(c.legal_pipeline_id),group=c.group_id?state.groups.find(g=>g.id===c.group_id):null,org=c.organization_id?state.orgs.find(o=>o.id===c.organization_id):null;modal(`<div class="modal-head"><div><h2>${esc(c.title)}</h2><div class="card-sub">${c.debtor_name?esc(c.debtor_name):'Должник не указан'}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="detail-layout modal-card-layout" style="margin-top:14px"><div><div class="section" style="margin-top:0;padding-top:0;border-top:0"><h3>Юридический этап</h3>${stageReadOnly(stages,c.legal_stage_id)}</div><div class="section"><h3>Источник</h3>${sourceReadOnly(c.source||'not_set')}</div>${c.profit!==null&&c.profit!==undefined?`<div class="section"><h3>Прибыль</h3><div class="card-view-value">${fmtMoney(c.profit)}</div></div>`:''}${org?`<div class="section"><h3>Организация</h3><button class="btn" onclick="openOrg('${org.id}')">${esc(org.name)}</button></div>`:''}${group?`<div class="section"><h3>Группа</h3><button class="btn" onclick="openGroup('${group.id}')">${esc(group.name)}</button></div>`:''}<div class="section"><div class="list">${caseFieldView('Должник',c.debtor_name)}${caseFieldView('Идентификатор',c.debtor_identifier)}${c.notes?caseFieldView('Заметка',c.notes):''}</div></div><div class="section"><div class="actions"><button class="btn" onclick="newTask('${todayKey()}','${org?.id||''}','${id}')">Поставить задачу</button><button class="btn" onclick="editCase('${id}')">Редактировать</button></div></div><div class="delete-row"><button class="btn danger small" onclick="deleteCase('${id}')">Удалить карточку</button></div></div><div class="detail-side"><h3 style="margin-top:0">Комментарии</h3>${commentsHtml('case',id)}</div></div>`)}

function editOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;const stages=stagesFor(o.sales_pipeline_id);modal(`<div class="modal-head"><div><h2>Редактирование организации</h2><div class="card-sub">Изменения сохранятся только после нажатия «Сохранить».</div></div><button class="close" onclick="openOrg('${id}')">×</button></div><form id="editOrgForm" class="edit-panel" style="margin-top:16px"><div class="grid"><div class="field full"><label>Название организации</label><input name="name" value="${esc(o.name)}" required></div><div class="field"><label>Контакт</label><input name="contact_name" value="${esc(o.contact_name||'')}"></div><div class="field"><label>Должность</label><input name="position" value="${esc(o.position||'')}"></div><div class="field"><label>Телефон</label><input name="phone" value="${esc(o.phone||'')}"></div><div class="field"><label>Email</label><input name="email" value="${esc(o.email||'')}"></div><div class="field"><label>Telegram</label><input name="telegram" value="${esc(o.telegram||'')}"></div><div class="field"><label>Дополнительный контакт</label><input name="max_contact" value="${esc(o.max_contact||'')}"></div><div class="field"><label>Сайт</label><input name="website" value="${esc(o.website||'')}"></div><div class="field"><label>ИНН</label><input name="inn" value="${esc(o.inn||'')}"></div><div class="field"><label>Продажи</label>${stagePicker(stages,o.sales_stage_id)}</div><div class="field"><label>Источник</label>${sourceButtons(o.source||'not_set','editOrgSource')}</div><div class="field full"><label>Стоимость услуг</label><div class="cost-editor"><input id="editOrgCost" name="service_cost" type="number" step="0.01" value="${esc(o.service_cost??'')}" placeholder="Сумма" ${o.service_cost_unknown!==false?'disabled':''}><label class="checkline compact"><input id="editOrgUnknown" type="checkbox" ${o.service_cost_unknown!==false?'checked':''}><span>Неизвестно</span></label></div></div><div class="field full"><label>Заметка</label><textarea name="notes">${esc(o.notes||'')}</textarea></div></div><div class="edit-actions"><button type="button" class="btn cancel-card" onclick="openOrg('${id}')">Отмена</button><button class="btn save-card">Сохранить</button></div></form>`);const u=document.getElementById('editOrgUnknown'),cost=document.getElementById('editOrgCost');const sync=()=>{cost.disabled=u.checked;if(u.checked)cost.value=''};u.onchange=sync;cost.oninput=()=>{if(cost.value){u.checked=false;cost.disabled=false}};document.getElementById('editOrgForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),stage=e.target.querySelector('.stage-value')?.value||o.sales_stage_id,source=e.target.querySelector('.source-value')?.value||o.source||'not_set';const payload={name:f.get('name'),contact_name:f.get('contact_name')||null,position:f.get('position')||null,phone:f.get('phone')||null,email:f.get('email')||null,telegram:f.get('telegram')||null,max_contact:f.get('max_contact')||null,website:f.get('website')||null,inn:f.get('inn')||null,notes:f.get('notes')||null,sales_stage_id:stage,source,service_cost_unknown:u.checked,service_cost:u.checked||!f.get('service_cost')?null:Number(f.get('service_cost')),updated_at:new Date().toISOString()};const {error}=await sb.from('crm_organizations').update(payload).eq('id',id);if(error){toast(error.message);return}await reload();openOrg(id);toast('Изменения сохранены')}}
function editCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;const stages=stagesFor(c.legal_pipeline_id),orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===c.organization_id?'selected':''}>${esc(o.name)}</option>`).join('');modal(`<div class="modal-head"><div><h2>Редактирование дела</h2><div class="card-sub">Все изменения применяются одной кнопкой.</div></div><button class="close" onclick="openCase('${id}')">×</button></div><form id="editCaseForm" class="edit-panel" style="margin-top:16px"><div class="grid"><div class="field full"><label>Название дела</label><input name="title" value="${esc(c.title)}" required></div><div class="field"><label>Должник</label><input name="debtor_name" value="${esc(c.debtor_name||'')}"></div><div class="field"><label>Идентификатор</label><input name="debtor_identifier" value="${esc(c.debtor_identifier||'')}"></div><div class="field"><label>Юридический этап</label>${stagePicker(stages,c.legal_stage_id)}</div><div class="field"><label>Источник</label>${sourceButtons(c.source||'not_set','editCaseSource')}</div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Прибыль</label><input name="profit" type="number" step="0.01" value="${esc(c.profit??'')}" placeholder="Сумма"></div><div class="field full"><label>Заметка</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div><div class="edit-actions"><button type="button" class="btn cancel-card" onclick="openCase('${id}')">Отмена</button><button class="btn save-card">Сохранить</button></div></form>`);document.getElementById('editCaseForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),stage=e.target.querySelector('.stage-value')?.value||c.legal_stage_id,source=e.target.querySelector('.source-value')?.value||c.source||'not_set';const payload={title:f.get('title'),debtor_name:f.get('debtor_name')||null,debtor_identifier:f.get('debtor_identifier')||null,legal_stage_id:stage,source,organization_id:f.get('organization_id')||null,profit:f.get('profit')===''?null:Number(f.get('profit')),notes:f.get('notes')||null,updated_at:new Date().toISOString()};const {error}=await sb.from('crm_cases').update(payload).eq('id',id);if(error){toast(error.message);return}await reload();openCase(id);toast('Изменения сохранены')}}
function openGroup(id){const g=state.groups.find(x=>x.id===id),cs=state.cases.filter(c=>c.group_id===id);modal(`<div class="modal-head"><div><h2>${esc(g?.name||'Группа')}</h2><div class="card-sub">${cs.length} самостоятельных дел · одна организация</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section" style="margin-top:16px"><h3>Дела группы</h3><div class="list">${cs.map(c=>`<div class="row"><div><strong>${esc(c.title)}</strong><div class="card-sub">${c.debtor_name?esc(c.debtor_name):''}</div></div><button class="btn small" onclick="openCase('${c.id}')">Открыть</button></div>`).join('')||'<div class="empty">Пока нет карточек.</div>'}</div></div>`)}
function newGroupForOrg(orgId){toast('Группы создаются из юридической воронки: нажмите «Создать группу» и выберите карточки')}
async function newLegalPipeline(){const name=prompt('Название юридической воронки');if(!name?.trim())return;const {data,error}=await sb.from('crm_pipelines').insert({name:name.trim(),entity_type:'case',is_system:false,sort_order:state.pipelines.length,created_by:state.user.id}).select().single();if(error)toast(error.message);else{state.legalPipelineView=data.id;await reload();toast('Воронка создана')}}
async function renamePipeline(id){const p=state.pipelines.find(x=>x.id===id),name=prompt('Новое название',p?.name);if(!name?.trim())return;const {error}=await sb.from('crm_pipelines').update({name:name.trim()}).eq('id',id);if(error)toast(error.message);else await reload()}
async function deletePipeline(id){const p=state.pipelines.find(x=>x.id===id);if(!p)return;if(p.is_system){toast('Системную воронку удалить нельзя');return}if(!confirm(`Удалить воронку «${p.name}»? Дела не удаляются.`))return;if(state.cases.some(c=>c.legal_pipeline_id===id)){toast('В воронке есть дела. Сначала перенесите их в другую воронку.');return}const {error}=await sb.from('crm_pipelines').update({active:false}).eq('id',id);if(error)toast(error.message);else{state.legalPipelineView='all';await reload()}}
async function newStage(pid){const name=prompt('Название новой колонки');if(!name?.trim())return;const max=Math.max(-1,...stagesFor(pid).map(s=>s.sort_order));const {error}=await sb.from('crm_pipeline_stages').insert({pipeline_id:pid,name:name.trim(),sort_order:max+1});if(error)toast(error.message);else await reload()}
async function renameStage(id){const s=state.stages.find(x=>x.id===id),name=prompt('Новое название колонки',s?.name);if(!name?.trim())return;const {error}=await sb.from('crm_pipeline_stages').update({name:name.trim()}).eq('id',id);if(error)toast(error.message);else await reload()}
async function deleteStage(id){const s=state.stages.find(x=>x.id===id);if(!s)return;const used=state.cases.filter(c=>c.legal_stage_id===id);if(used.length){const targets=stagesFor(s.pipeline_id).filter(x=>x.id!==id);if(!targets.length){toast('Нельзя удалить единственную колонку с делами');return}const options=targets.map((x,i)=>`${i+1}. ${x.name}`).join('\n');const pick=prompt(`В колонке есть ${used.length} дел. Куда их перенести?\n${options}\nВведите номер`),target=targets[Number(pick)-1];if(!target)return;const {error:moveError}=await sb.from('crm_cases').update({legal_stage_id:target.id,updated_at:new Date().toISOString()}).eq('legal_stage_id',id);if(moveError){toast(moveError.message);return}}const {error}=await sb.from('crm_pipeline_stages').update({active:false}).eq('id',id);if(error)toast(error.message);else await reload()}
function newTask(date=todayKey(),orgId='',caseId=''){const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===orgId?'selected':''}>${esc(o.name)}</option>`).join('');const caseOptions=state.cases.map(c=>`<option value="${c.id}" ${c.id===caseId?'selected':''}>${esc(c.title)}</option>`).join('');modal(`<div class="modal-head"><h2>Новая задача</h2><button class="close" onclick="closeModal()">×</button></div><form id="taskForm" class="grid" style="margin-top:16px"><div class="field full"><label>Задача</label><input name="title" required></div><div class="field"><label>Дата</label><input name="due_date" type="date" value="${esc(date||todayKey())}"></div><div class="field"><label>Время</label><input name="due_time" type="time"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Дело</label><select name="case_id"><option value="">Не указано</option>${caseOptions}</select></div><div class="field full"><label>Заметка</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary">Создать</button></div></form>`);document.getElementById('taskForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_tasks').insert({title:f.get('title'),due_date:f.get('due_date')||null,due_time:f.get('due_time')||null,organization_id:f.get('organization_id')||null,case_id:f.get('case_id')||null,notes:f.get('notes')||null,owner_id:state.user.id});if(error)toast(error.message);else{closeModal();await reload();toast('Задача создана')}}}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===t.organization_id?'selected':''}>${esc(o.name)}</option>`).join('');const caseOptions=state.cases.map(c=>`<option value="${c.id}" ${c.id===t.case_id?'selected':''}>${esc(c.title)}</option>`).join('');modal(`<div class="modal-head"><h2>Редактировать задачу</h2><button class="close" onclick="closeModal()">×</button></div><form id="editTaskForm" class="grid" style="margin-top:16px"><div class="field full"><label>Задача</label><input name="title" value="${esc(t.title)}" required></div><div class="field"><label>Дата</label><input name="due_date" type="date" value="${esc(t.due_date||'')}"></div><div class="field"><label>Время</label><input name="due_time" type="time" value="${esc(t.due_time||'')}"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Дело</label><select name="case_id"><option value="">Не указано</option>${caseOptions}</select></div><div class="field full"><label>Заметка</label><textarea name="notes">${esc(t.notes||'')}</textarea></div><div class="field full"><button class="btn primary">Сохранить</button></div></form>`);document.getElementById('editTaskForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_tasks').update({title:f.get('title'),due_date:f.get('due_date')||null,due_time:f.get('due_time')||null,organization_id:f.get('organization_id')||null,case_id:f.get('case_id')||null,notes:f.get('notes')||null,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{closeModal();await reload();toast('Сохранено')}}}
async function toggleTask(id,done){const {error}=await sb.from('crm_tasks').update({completed:done,completed_at:done?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return}await reload()}
async function startApp(){if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ok=await ensureMember();if(!ok){toast('Нет доступа к CRM');await sb.auth.signOut();showLogin();return}const {data:{session}}=await sb.auth.getSession();state.user=session?.user||state.user;if(!state.user){showLogin();return}await reload()}
async function boot(){state.theme=localStorage.getItem('pravodom_theme')||'system';applyTheme();sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:{session}}=await sb.auth.getSession();if(session){try{const ok=await ensureMember();if(!ok){toast('Нет доступа к CRM');await sb.auth.signOut();showLogin();return}state.user=session.user;await reload()}catch(e){console.error(e);showFatal(e)}}else showLogin();sb.channel('pravodom-live').on('postgres_changes',{event:'*',schema:'public',table:'crm_pipelines'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_pipeline_stages'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_organizations'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_cases'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_case_groups'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_tasks'},()=>reload()).subscribe();sb.auth.onAuthStateChange(async(_e,s)=>{if(s?.user&&!state.user){state.user=s.user;try{if(await ensureMember())await reload()}catch(e){showFatal(e)}}else if(!s){state.user=null;showLogin()}})}
document.addEventListener('click',e=>{if(!e.target.closest('.soft-select'))document.querySelectorAll('.soft-select.open').forEach(x=>x.classList.remove('open'))});
boot();
