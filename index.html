/* v2.5 card editor */
.card-view-value{display:flex;align-items:center;min-height:40px;padding:10px 12px;border:1px solid transparent;border-radius:14px;background:var(--panel2);color:var(--text)}
.card-view-value.muted{color:var(--muted)}
.pill-value{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--panel2);color:var(--text);font-size:13px}
.pill-value .pill-dot{width:7px;height:7px;border-radius:50%;background:#f08a24}
.edit-panel{display:grid;gap:11px}
.edit-panel .field input,.edit-panel .field textarea{background:var(--panel2);border-color:transparent}
.edit-panel .field input:focus,.edit-panel .field textarea:focus{background:var(--panel);border-color:#f08a24}
.edit-field-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.soft-select{position:relative}
.soft-select-button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid transparent;background:var(--panel2);color:var(--text);padding:11px 13px;border-radius:14px;text-align:left}
.soft-select-button:hover{background:color-mix(in srgb,var(--panel2) 82%,#f08a24 18%)}
.soft-select-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:6px;box-shadow:var(--shadow);display:none}
.soft-select.open .soft-select-menu{display:grid;gap:3px}
.soft-select-option{border:0;background:transparent;color:var(--text);padding:10px 11px;border-radius:10px;text-align:left}
.soft-select-option:hover,.soft-select-option.active{background:var(--panel2)}
.cost-editor{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}
.cost-editor input{width:100%}
.checkline.compact{border:0;background:var(--panel2);padding:9px 11px;border-radius:14px;white-space:nowrap}
.checkline.compact span{font-size:12px}
.edit-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn.save-card{background:#dff2e7;color:#22613d;border-color:#c9e8d5}
body.dark .btn.save-card{background:#20352b;color:#a9e2bf;border-color:#31533f}
.btn.cancel-card{background:var(--panel2);border-color:transparent}
@media(max-width:760px){.cost-editor{grid-template-columns:1fr}.edit-actions{justify-content:stretch}.edit-actions .btn{flex:1}}


/* v2.6 legal workspace */
.modal.case-modal{width:min(1120px,95vw);height:min(88vh,900px);min-width:620px;min-height:520px;max-width:95vw;max-height:92vh;resize:both;overflow:auto}
.legal-head-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pipeline-tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}

.pipeline-tools .btn:hover,.column-tools .btn:hover{background:var(--panel);border-color:var(--line);color:var(--text)}
.pipeline-tools .danger:hover,.column-tools .danger:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,transparent)}
.column-tools{display:flex;gap:2px;margin-top:5px;opacity:.72}
.column-tools .btn{padding:3px 5px;font-size:10px}
.legal-create-actions{display:flex;gap:9px;align-items:center}
.legal-create-actions .pipeline-create{margin-left:12px;background:transparent;color:var(--muted);border-color:transparent}
.legal-create-actions .pipeline-create:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
.field-builder{display:grid;gap:9px}
.field-builder-row{display:grid;grid-template-columns:1.2fr 130px 1fr auto;gap:7px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--panel2)}
.field-builder-row input,.field-builder-row select{min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px;border-radius:9px}
.case-fields-list{display:grid;gap:8px}.case-field-display{display:grid;gap:4px}.case-field-display .card-view-value{white-space:pre-wrap;word-break:break-word}
.documents-box{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.document-list{display:grid;gap:7px;margin-top:9px}.document-row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:9px 11px;border:1px solid var(--line);background:var(--panel2);border-radius:11px}.document-main{min-width:0}.document-name{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.document-meta{font-size:10px;color:var(--muted);margin-top:3px}.document-actions{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}.document-actions .btn{padding:5px 7px;font-size:11px}.upload-label{display:inline-flex;align-items:center;gap:6px}

.preview-overlay{z-index:50}
.preview-modal{width:min(1100px,96vw);height:min(88vh,880px);max-width:96vw;max-height:88vh;display:flex;flex-direction:column;padding:14px;gap:10px}
.preview-modal .modal-head{flex:none}
.preview-content{flex:1;background:var(--panel2);border-radius:13px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;min-height:280px}
.preview-content iframe{width:100%;height:100%;border:0;background:#fff;border-radius:13px}
.preview-content img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
.preview-loading{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;height:100%}
.preview-loading .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--muted);border-top-color:#f08a24;border-radius:50%;animation:pspin 1s linear infinite}
@keyframes pspin{to{transform:rotate(360deg)}}
.preview-unsupported{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 20px;text-align:center}
.preview-unsupported-icon{font-size:56px;line-height:1}
.preview-unsupported-title{font-size:17px;font-weight:650;color:var(--text)}
.preview-unsupported-text{font-size:13px;color:var(--muted);max-width:420px;line-height:1.5}
.upload-progress{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 18px;box-shadow:var(--shadow);z-index:60;min-width:300px;max-width:380px}
.upload-progress-title{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.upload-progress-name{font-size:13px;font-weight:600;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-progress-bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.upload-progress-bar-fill{height:100%;background:#f08a24;transition:width .2s;width:0}
.upload-progress-stat{font-size:11px;color:var(--muted);text-align:right}
.upload-progress-cancel{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;cursor:pointer}
.upload-progress-cancel:hover{color:var(--danger)}
.document-row .doc-progress{font-size:11px;color:#f08a24;margin-top:4px}
.upload-label{cursor:pointer}
.preview-content .docx-container{width:100%;height:100%;overflow:auto;background:#fff;border-radius:13px;padding:18px 22px;box-sizing:border-box}
.preview-content .docx-container .docx-wrapper{background:transparent;padding:0;margin:0}
.preview-content .docx-container .docx-wrapper>section.docx{background:#fff;box-shadow:0 2px 14px rgba(16,24,40,.12);margin:0 auto 22px!important;padding:60px 70px!important;border-radius:4px}
@media(max-width:760px){.preview-content .docx-container .docx-wrapper>section.docx{padding:30px 18px!important}}
.preview-content .xlsx-wrap{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;background:#fff;border-radius:13px}
.preview-content .xlsx-tabs{display:flex;gap:0;background:var(--panel2);padding:6px 6px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;min-height:36px}
.preview-content .xlsx-tab{background:transparent;padding:7px 14px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:7px 7px 0 0;white-space:nowrap;border:1px solid transparent;border-bottom:0}
.preview-content .xlsx-tab:hover{color:var(--text)}
.preview-content .xlsx-tab.active{background:#fff;color:var(--text);border-color:var(--line)}
.preview-content .xlsx-content{flex:1;overflow:auto;background:#fff;padding:8px 4px 0}
.preview-content .xlsx-content table{border-collapse:collapse;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0 auto}
.preview-content .xlsx-content td,.preview-content .xlsx-content th{border:1px solid #dfe3e8;padding:3px 7px;min-width:50px;max-width:420px;overflow:hidden;text-overflow:ellipsis;vertical-align:top;empty-cells:show;background:#fff}
.preview-content .xlsx-content td:empty{background:#fafbfc}

/* Компактный режим: переключатель стадии в шапке карточки */
.case-stage-bar{padding:10px 0 12px;margin:0 0 4px;border-bottom:1px solid var(--line)}
.stage-switcher{display:flex;gap:5px;flex-wrap:wrap}
.stage-pill{padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s ease;line-height:1.4;font-family:inherit}
.stage-pill:hover{color:var(--text);border-color:color-mix(in srgb,var(--pill-color) 38%,var(--line));background:color-mix(in srgb,var(--pill-color) 9%,var(--panel2))}
.stage-pill.active{background:color-mix(in srgb,var(--pill-color) 16%,transparent);color:var(--pill-color);border-color:color-mix(in srgb,var(--pill-color) 34%,var(--line));font-weight:600}
/* Шапка карточки дела в компактном режиме */
.case-head{align-items:flex-start;gap:10px}
.case-head-info{min-width:0;flex:1;overflow:hidden}
.case-head-info h2{margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case-head-actions{display:flex;gap:5px;align-items:center;flex:none}
.case-head-actions .close{margin-left:2px}
/* Двигаемая граница между колонками карточки дела */
body.compact-ui .modal-card-layout{grid-template-columns:var(--case-split,minmax(0,1fr) 6px minmax(320px,.9fr));gap:0}
body.compact-ui .detail-main{padding-right:14px;min-width:0}
body.compact-ui .detail-resizer{cursor:col-resize;background:transparent;position:relative;margin:0 -3px;z-index:2;min-width:6px;flex:none;width:6px}
body.compact-ui .detail-resizer::before{content:'';position:absolute;inset:0 2px;background:var(--line);border-radius:99px;transition:background .15s}
body.compact-ui .detail-resizer:hover::before,body.compact-ui .detail-resizer.active::before{background:#f08a24}
body.compact-ui .detail-side{border-left:1px solid var(--line);padding-left:18px;padding-right:0;min-width:0}
/* Мягкие тени для более приятного вида (обе темы) */
.card{box-shadow:0 1px 3px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.04)}
body.dark .card,body.system[data-theme="dark"] .card{box-shadow:0 1px 3px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.18)}
/* Менее резкий цвет границы в обоих темах */
body.compact-ui .detail-layout{gap:0}
/* Stage pill слегка крупнее на мобильных */
@media(max-width:760px){.case-stage-bar{overflow-x:auto;white-space:nowrap;padding-bottom:8px}.stage-switcher{flex-wrap:nowrap}}

/* v3.7 — больше контраста и приятности */
.close{transition:background .15s,color .15s,border-color .15s}
.close:hover{background:color-mix(in srgb,#dc2626 14%,transparent);color:#dc2626}
body.dark .close:hover,body.system[data-theme="dark"] .close:hover{background:color-mix(in srgb,#ef4444 18%,transparent);color:#fca5a5}
/* Колонки канбана — лёгкая подложка для визуального отделения */
.column{background:color-mix(in srgb,var(--panel) 65%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 8px;min-height:80px}
.column-head{margin-bottom:8px}
.column-title{font-size:12px;font-weight:600;color:var(--text);text-transform:none}
.column-tools .btn{padding:3px 7px;font-size:10px}
/* Карточки на доске — мягкая тень для отделения от фона колонки */
.column .card{box-shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.06);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
body.dark .column .card,body.system[data-theme="dark"] .column .card{box-shadow:0 1px 2px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.25)}
/* Поля данных в карточках — лёгкая подложка, чтобы данные не сливались с фоном */
.case-field-display,.detail-main .field{background:color-mix(in srgb,var(--panel2) 50%,transparent);padding:8px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);margin-bottom:6px}
.edit-field-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;font-weight:600}
.card-view-value{font-size:14px;color:var(--text);line-height:1.4;word-break:break-word}
/* Метаданные в карточке канбана — более контрастные */
.card .meta .chip{background:color-mix(in srgb,var(--panel) 80%,var(--panel2));border:1px solid color-mix(in srgb,var(--line) 60%,transparent);color:var(--text);font-weight:500}
/* Mягкая красная подсветка для danger-кнопок на hover */
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 24%,transparent)}
/* Подложка для блока документов в карточке дела */
.documents-box{background:color-mix(in srgb,var(--panel2) 40%,transparent);padding:12px;border-radius:13px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);margin-top:14px}
/* Сгруппированные дела в группе — выделяем цветом акцента группы */
.group{border-left:3px solid var(--group-color);padding-left:10px;margin-left:-3px}
/* Кнопки в шапке карточки дела — равная ширина для аккуратности */
.case-head-actions .btn.small{min-width:0;padding:6px 12px;font-size:12px}
/* Список в архиве — мягкие ряды */
.archive-section{margin-top:18px}
.archive-section h3{margin:0 0 10px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.archive-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid var(--line);background:var(--panel);border-radius:13px;margin-bottom:7px}
.archive-row .archive-info{min-width:0;flex:1}
.archive-row .archive-info strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.archive-row .archive-info .card-sub{font-size:11px;color:var(--muted);margin-top:2px}
.archive-row .archive-actions{display:flex;gap:6px;flex:none}
/* Группа: панель массовых действий */
.bulk-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px}
.bulk-actions .btn{font-size:11px;padding:8px 6px;text-align:center}
@media(max-width:760px){.bulk-actions{grid-template-columns:1fr}}
/* Текстовая область для массового ввода */
.bulk-textarea{width:100%;min-height:140px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px;border-radius:11px;font:inherit;resize:vertical}
.bulk-textarea:focus{border-color:#f08a24;box-shadow:0 0 0 3px color-mix(in srgb,#f08a24 12%,transparent);outline:none}
</style>

<body class="system">
<div id="root"></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://ncuthxvxiwghjgduchhc.supabase.co';
const SUPABASE_KEY='sb_publishable_30uyWrQ06THITcEIVe4WTw_2BeQSGnp';
let sb=null;
const state={view:'today',user:null,pipelines:[],stages:[],orgs:[],cases:[],groups:[],tasks:[],comments:[],caseFields:[],caseFieldValues:[],caseFiles:[],search:'',theme:'system',uiMode:'full',legalPipelineView:null,taskDate:null,calendarMonth:null,groupSelectMode:false,groupSelected:new Set(),groupTargetGroupId:null};
const SOURCE_LABEL={mailing:'с рассылок',dmitry_base:'база клиентов Дмитрия',not_set:'не установлено'};
const GROUP_COLORS=['#5b8def','#e07a5f','#3aa981','#9b6bd3','#d49a3a','#4f9da6','#d45d9d','#6d8b74','#8b6f47','#6573c3','#b05a75','#4b7f8c'];
let groupColorSaving=false;
const STAGE_COLORS=['#5b8def','#3aa981','#d49a3a','#9b6bd3','#4f9da6','#e07a5f','#d45d9d','#6573c3','#b05a75','#4b7f8c'];
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),2800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtMoney(v){if(v===null||v===undefined||v==='')return '';return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(v))+' ₽'}
function dateKey(d){return d.toISOString().slice(0,10)}
function localDateKey(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function parseDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}
function fmtDateTime(v){const d=new Date(v);return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtDate(s){if(!s)return '';return parseDate(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function todayKey(){return localDateKey()}
function pipelineFor(type){return state.pipelines.filter(p=>p.entity_type===type&&p.active)}
function stagesFor(pid){return state.stages.filter(s=>s.pipeline_id===pid&&s.active).sort((a,b)=>a.sort_order-b.sort_order)}
function ensureMember(){return sb.rpc('is_crm_member').then(({data,error})=>{if(error)throw error;return data===true})}
function applyTheme(){document.body.classList.remove('dark','system','light');if(state.theme==='dark')document.body.classList.add('dark');else if(state.theme==='light')document.body.classList.add('light');else if(state.theme==='system')document.body.classList.add('system');localStorage.setItem('pravodom_theme',state.theme)}
function applyUiMode(){document.body.classList.remove('classic-ui','compact-ui','simple-ui','full-ui');let mode=state.uiMode;if(mode==='full'||mode==='simple')mode='classic';document.body.classList.add(mode==='compact'?'compact-ui':'classic-ui');localStorage.setItem('pravodom_ui_mode',mode)}
function pendingTasks(){return state.tasks.filter(t=>!t.completed)}
function todayPending(){return pendingTasks().filter(t=>t.due_date===todayKey())}
function overdueTasks(){return pendingTasks().filter(t=>t.due_date&&t.due_date<todayKey())}
function showLogin(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><h1>CRM Праводом.рф</h1><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button class="btn primary">Войти</button></form></div></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)throw error;await startApp()}catch(x){toast(x.message||'Ошибка входа')}}}
function nav(){const hasToday=todayPending().length>0;return `<aside class="sidebar"><div class="logo">CRM Праводом.рф</div><div class="sidebar-nav"><div class="nav"><button class="${state.view==='today'?'active ':''}${hasToday?'today-active':''}" onclick="setView('today')">Сегодня ${hasToday?'<span class="today-dot"></span>':''}</button><button class="${state.view==='sales'?'active':''}" onclick="setView('sales')">Клиенты</button><button class="${state.view==='legal'?'active':''}" onclick="setView('legal')">Юридическая работа</button><button class="${state.view==='clients'?'active':''}" onclick="setView('clients')">Архив</button><button class="${state.view==='tasks'?'active':''}" onclick="setView('tasks')">Задачи</button></div></div><div class="sidebar-bottom"><button class="btn settings-btn ${state.view==='settings'?'primary':''}" onclick="setView('settings')">Настройки</button><div class="user">${esc(state.user?.email||'')}</div></div></aside>`}
function bottomNav(){const hasToday=todayPending().length>0;return `<nav class="bottomnav"><button class="${state.view==='today'?'active ':''}${hasToday?'today-active':''}" onclick="setView('today')">Сегодня${hasToday?' •':''}</button><button class="${state.view==='sales'?'active':''}" onclick="setView('sales')">Клиенты</button><button class="${state.view==='legal'?'active':''}" onclick="setView('legal')">Юр. работа</button><button class="${state.view==='clients'?'active':''}" onclick="setView('clients')">Архив</button><button class="${state.view==='tasks'?'active':''}" onclick="setView('tasks')">Задачи</button><button class="${state.view==='settings'?'active':''}" onclick="setView('settings')">Настройки</button></nav>`}
function shell(){document.getElementById('root').innerHTML=`<div class="app">${nav()}<main id="main"></main></div>${bottomNav()}`;render()}
function setView(v){state.view=v;state.search='';shell()}
function header(title,button=''){return `<div class="top"><div><h1>${title}</h1></div><div class="actions">${button}</div></div>`}
function searchBar(){return `<input class="search" placeholder="Поиск" value="${esc(state.search)}" oninput="state.search=this.value;render()">`}
function render(){const main=document.getElementById('main');if(!main)return;if(state.view==='today')renderToday(main);else if(state.view==='sales')renderSales(main);else if(state.view==='legal')renderLegal(main);else if(state.view==='clients')renderClients(main);else if(state.view==='tasks')renderTasks(main);else renderSettings(main)}
function renderToday(main){const overdue=overdueTasks(),today=todayPending();let body=header('Сегодня',`<button class="btn primary" onclick="newTask('${todayKey()}')">+ Задача</button>`);if(today.length===1)body+=`<div class="today-banner">Есть 1 невыполненная задача сегодня</div>`;else if(today.length>1)body+=`<div class="today-banner">Есть ${today.length} невыполненных задач сегодня</div>`;else body+=`<div class="card"><div class="card-title">На сегодня всё спокойно</div><div class="card-sub">Невыполненных задач на сегодня нет.</div></div>`;if(overdue.length)body+=`<div class="section"><h3>Просрочено</h3>${taskListHtml(overdue)}</div>`;if(today.length)body+=`<div class="section"><h3>Сегодня</h3>${taskListHtml(today)}</div>`;main.innerHTML=body}
function renderSales(main){const p=pipelineFor('organization')[0],stages=stagesFor(p?.id);main.innerHTML=header('Клиенты',`<button class="btn primary" onclick="newOrg()">Добавить</button>`)+`<div class="toolbar">${searchBar()}<button class="btn small" onclick="openProfitSummary()">Прибыль</button></div><div class="board">${stages.map(s=>`<section class="column"><div class="column-head"><span class="column-title">${esc(s.name)}</span><span class="count">${state.orgs.filter(o=>o.sales_stage_id===s.id&&matchOrg(o)).length}</span></div>${state.orgs.filter(o=>o.sales_stage_id===s.id&&matchOrg(o)).map(orgCard).join('')||'<div class="empty">Пусто</div>'}</section>`).join('')||'<div class="empty">Воронка «Клиенты» не настроена.</div>'}</div>`}
function matchOrg(o){const q=state.search.toLowerCase();return !q||[o.name,o.contact_name,o.phone,o.email,o.inn].filter(Boolean).some(x=>String(x).toLowerCase().includes(q))}
function orgCostHtml(o){if(o.service_cost_unknown!==false)return '<span class="chip">услуги: ?</span>';if(o.service_cost!==null&&o.service_cost!==undefined&&o.service_cost!=='')return `<span class="chip">услуги: ${fmtMoney(o.service_cost)}</span>`;return ''}
function orgCard(o){return `<article class="card" onclick="openOrg('${o.id}')"><div class="card-title">${esc(o.name)}</div>${o.contact_name?`<div class="card-sub">${esc(o.contact_name)}</div>`:''}<div class="meta"><span class="chip">${esc(SOURCE_LABEL[o.source||'not_set'])}</span>${orgCostHtml(o)}</div>${o.phone?`<div class="card-sub" style="margin-top:9px">${esc(o.phone)}</div>`:''}<button class="btn card-action" onclick="event.stopPropagation();openOrg('${o.id}')">Открыть</button></article>`}
function renderLegal(main){const ps=pipelineFor('case');if(!state.legalPipelineView&&ps[0])state.legalPipelineView=ps[0].id;const selected=state.legalPipelineView==='all'?null:ps.find(p=>p.id===state.legalPipelineView)||ps[0];const tabs=ps.map(p=>`<button class="btn pipeline-tab ${selected?.id===p.id?'active':''}" onclick="selectLegalPipeline('${p.id}')">${esc(p.name)}</button>`).join('');const allTab=`<button class="btn pipeline-tab ${state.legalPipelineView==='all'?'active':''}" onclick="selectLegalPipeline('all')">Все воронки</button>`;main.innerHTML=header('Юридическая работа',`<div class="legal-create-actions"><button class="btn primary" onclick="newCase()">+ Дело</button><button class="btn pipeline-create" onclick="newLegalPipeline()">+ Воронка</button></div>`)+`<div class="pipeline-switch">${tabs}${allTab}</div>${selected?legalPipelineHtml(selected):ps.map(legalPipelineHtml).join('')}`;if(!ps.length)main.innerHTML+=`<div class="card"><div class="card-title">Юридических воронок пока нет</div><div class="card-sub">Создайте первую воронку под свой процесс.</div><button class="btn primary" style="margin-top:12px" onclick="newLegalPipeline()">Создать первую воронку</button></div>`}
function selectLegalPipeline(id){state.legalPipelineView=id;state.search='';render()}
function legalPipelineHtml(p){const stages=stagesFor(p.id),total=state.cases.filter(c=>c.legal_pipeline_id===p.id).length;const selectMode=state.groupSelectMode&&state.legalPipelineView===p.id;return `<section style="margin-bottom:22px"><div class="toolbar"><div><h2 style="margin:0;font-size:17px">${esc(p.name)}</h2><div class="card-sub">${total} дел</div></div><div class="pipeline-tools">${selectMode?`<span class="group-note">Выбрано: ${state.groupSelected.size}</span><button class="btn primary small" onclick="createGroupFromSelection()">${state.groupTargetGroupId?'Добавить в группу':'Создать группу'}</button><button class="btn small" onclick="cancelGroupSelection()">Отмена</button>`:`<button class="btn small" onclick="startGroupSelection('${p.id}')">Создать группу</button>`}<button class="btn small" onclick="manageCaseFields('${p.id}')">Параметры карточек</button><button class="btn small" onclick="renamePipeline('${p.id}')">Переименовать</button><button class="btn danger small" onclick="deletePipeline('${p.id}')">Удалить</button></div></div><div class="board">${stages.map(s=>{const cs=state.cases.filter(c=>c.legal_stage_id===s.id&&matchCase(c));return `<section class="column"><div class="column-head"><div><div class="column-title">${esc(s.name)}</div><div class="column-tools"><button class="btn" onclick="renameStage('${s.id}')">изменить</button><button class="btn danger" onclick="deleteStage('${s.id}')">удалить</button></div></div><span class="count">${cs.length}</span></div>${groupedCards(cs)}</section>`}).join('')}</div><div class="actions" style="margin-top:7px"><button class="btn small" onclick="newStage('${p.id}')">+ Колонка</button></div></section>`}
function profitSummaryAll(){const sums={mailing:0,dmitry_base:0,not_set:0};state.cases.filter(c=>isProfitVisible(c)).forEach(c=>sums[c.source||'not_set']+=Number(c.profit)||0);return `<div class="profit-summary compact"><div class="profit-item"><span class="card-sub">рассылки</span><strong>${fmtMoney(sums.mailing)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">база Дмитрия</span><strong>${fmtMoney(sums.dmitry_base)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">не установлено</span><strong>${fmtMoney(sums.not_set)||'0 ₽'}</strong></div></div>`}
function openProfitSummary(){const sums={mailing:0,dmitry_base:0,not_set:0};state.cases.filter(isProfitVisible).forEach(c=>sums[c.source||'not_set']+=Number(c.profit)||0);modal(`<div class="modal-head"><div><h2>Прибыль</h2><div class="card-sub">Только дела на стадии «Оплата получена» или позднее.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="profit-summary" style="margin-top:18px"><div class="profit-item"><span class="card-sub">с рассылок</span><strong>${fmtMoney(sums.mailing)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">база клиентов Дмитрия</span><strong>${fmtMoney(sums.dmitry_base)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">не установлено</span><strong>${fmtMoney(sums.not_set)||'0 ₽'}</strong></div></div>`)}
function isProfitVisible(c){if(c.profit===null||c.profit===undefined)return false;const p=state.pipelines.find(x=>x.id===c.legal_pipeline_id);const pay=stagesFor(p?.id).find(s=>s.name.trim().toLowerCase()==='оплата получена');const stage=state.stages.find(s=>s.id===c.legal_stage_id);return !!pay&&!!stage&&stage.pipeline_id===p.id&&stage.sort_order>=pay.sort_order}
function groupColor(g){return g?.color||GROUP_COLORS[Math.abs(hashCode(g?.id||''))%GROUP_COLORS.length]}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h}
function groupedCards(cs){const groups={},ungrouped=[];cs.forEach(c=>c.group_id?(groups[c.group_id]??=[]).push(c):ungrouped.push(c));let html='';Object.entries(groups).sort((a,b)=>String(a[1][0].created_at).localeCompare(String(b[1][0].created_at))).forEach(([gid,items])=>{const g=state.groups.find(x=>x.id===gid);html+=`<div class="group" style="--group-color:${groupColor(g)}"><div class="group-head"><div class="group-label"><span class="group-dot"></span><strong>${esc(g?.name||'Группа')}</strong></div><button class="btn small" onclick="event.stopPropagation();openGroup('${gid}')">Группа</button></div><div class="group-grid">${items.map(caseCard).join('')}</div></div>`});html+=ungrouped.map(caseCard).join('');return html||'<div class="empty">Пусто</div>'}
function matchCase(c){const q=state.search.toLowerCase();return !q||[c.title,c.debtor_name,c.debtor_identifier].filter(Boolean).some(x=>String(x).toLowerCase().includes(q))}

function renderClients(main){const archivedOrgs=state.orgs.filter(o=>o.deleted_at);const archivedCases=state.cases.filter(c=>c.deleted_at);const q=state.search.toLowerCase();const matchOrgA=o=>!q||[o.name,o.contact_name,o.phone,o.email,o.inn].filter(Boolean).some(x=>String(x).toLowerCase().includes(q));const matchCaseA=c=>!q||[c.title,c.debtor_name,c.debtor_identifier].filter(Boolean).some(x=>String(x).toLowerCase().includes(q));const orgsVisible=archivedOrgs.filter(matchOrgA);const casesVisible=archivedCases.filter(matchCaseA);main.innerHTML=header('Архив')+`<div class="toolbar">${searchBar()}</div>${(!archivedOrgs.length&&!archivedCases.length)?'<div class="card"><div class="card-title">Архив пуст</div><div class="card-sub">Удалённые карточки и дела будут появляться здесь. Из архива можно восстановить или удалить окончательно.</div></div>':''}<div class="archive-section">${orgsVisible.length?`<h3>Клиенты (${orgsVisible.length})</h3>${orgsVisible.map(o=>`<div class="archive-row"><div class="archive-info"><strong>${esc(o.name)}</strong><div class="card-sub">${o.contact_name?esc(o.contact_name)+' · ':''}архив ${fmtDate(o.deleted_at?.slice(0,10))}</div></div><div class="archive-actions"><button class="btn small" onclick="restoreOrg('${o.id}')">Восстановить</button><button class="btn small danger" onclick="purgeOrg('${o.id}')">Удалить навсегда</button></div></div>`).join('')}`:''}</div><div class="archive-section">${casesVisible.length?`<h3>Дела (${casesVisible.length})</h3>${casesVisible.map(c=>`<div class="archive-row"><div class="archive-info"><strong>${esc(c.title)}</strong><div class="card-sub">${c.debtor_name?esc(c.debtor_name)+' · ':''}архив ${fmtDate(c.deleted_at?.slice(0,10))}</div></div><div class="archive-actions"><button class="btn small" onclick="restoreCase('${c.id}')">Восстановить</button><button class="btn small danger" onclick="purgeCase('${c.id}')">Удалить навсегда</button></div></div>`).join('')}`:''}</div>${(archivedOrgs.length||archivedCases.length)&&(!orgsVisible.length&&!casesVisible.length)?'<div class="empty">Ничего не найдено по запросу.</div>':''}`}
function taskListHtml(tasks){return `<div class="task-list">${tasks.sort((a,b)=>(a.due_time||'99:99').localeCompare(b.due_time||'99:99')).map(taskHtml).join('')}</div>`}
function taskHtml(t){const org=t.organization_id?state.orgs.find(o=>o.id===t.organization_id):null,cas=t.case_id?state.cases.find(c=>c.id===t.case_id):null;const overdue=!t.completed&&t.due_date<todayKey();return `<div class="task ${t.completed?'done':''}"><input class="task-check" type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta ${overdue?'task-overdue':''}">${t.due_date?fmtDate(t.due_date):'Без даты'}${t.due_time?' · '+esc(t.due_time.slice(0,5)):''}${org?' · '+esc(org.name):''}${cas?' · '+esc(cas.title):''}</div>${t.notes?`<div class="card-sub">${esc(t.notes)}</div>`:''}</div><div class="task-actions"><button class="btn small" onclick="editTask('${t.id}')">Изменить</button></div></div>`}
function renderTasks(main){const now=state.calendarMonth||new Date(todayKey()+'T00:00:00'),y=now.getFullYear(),m=now.getMonth();if(!state.taskDate)state.taskDate=todayKey();const days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),offset=(first+6)%7;let cells='';for(let i=0;i<offset;i++)cells+=`<div></div>`;for(let d=1;d<=days;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,count=state.tasks.filter(t=>t.due_date===k).length;cells+=`<button class="day ${k===state.taskDate?'selected':''} ${k===todayKey()?'today':''}" onclick="selectTaskDate('${k}')"><div class="day-num">${d}</div>${count?`<div class="day-count">${count} ${count===1?'задача':count<5?'задачи':'задач'}</div>`:''}</button>`}const selectedTasks=state.tasks.filter(t=>t.due_date===state.taskDate);main.innerHTML=header('Задачи',`<button class="btn primary" onclick="newTask('${state.taskDate}')">+ Задача</button>`)+`<div class="calendar"><div class="calendar-head"><button class="btn small" onclick="shiftMonth(-1)">‹</button><strong>${now.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</strong><button class="btn small" onclick="shiftMonth(1)">›</button></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div><div class="section"><h3>${fmtDate(state.taskDate)}</h3>${selectedTasks.length?taskListHtml(selectedTasks):'<div class="empty">На эту дату задач нет.</div>'}</div>`}
function selectTaskDate(k){state.taskDate=k;state.calendarMonth=parseDate(k);render()}
function shiftMonth(delta){const d=state.calendarMonth||parseDate(state.taskDate||todayKey());state.calendarMonth=new Date(d.getFullYear(),d.getMonth()+delta,1);render()}
function renderSettings(main){main.innerHTML=header('Настройки')+`<div class="settings-grid"><section class="card settings-card"><div class="card-title">Режим интерфейса</div><div class="card-sub">Классический — текущий вид карточки дела. Компактный — переключатель стадии в шапке, кнопки действий в шапке, двигаемая граница между колонками. Все вкладки и функции сохраняются в обоих режимах.</div><select style="max-width:280px;margin-top:12px" onchange="state.uiMode=this.value;applyUiMode();render()"><option value="classic" ${state.uiMode==='classic'?'selected':''}>Классический (по умолчанию)</option><option value="compact" ${state.uiMode==='compact'?'selected':''}>Компактный (с переключателем стадии)</option></select></section><section class="card settings-card"><div class="card-title">Тема CRM</div><div class="card-sub">Выберите внешний вид Праводом.рф.</div><select style="max-width:280px;margin-top:12px" onchange="state.theme=this.value;applyTheme();render()"><option value="system" ${state.theme==='system'?'selected':''}>⚙️ Тема системы</option><option value="light" ${state.theme==='light'?'selected':''}>☀️ Дневная</option><option value="dark" ${state.theme==='dark'?'selected':''}>🌙 Ночная</option></select></section><section class="card settings-card"><div class="card-title">Шаблоны</div><div class="card-sub">Перенос данных из одной или нескольких карточек в шаблонные документы.</div><button class="btn" style="margin-top:10px" onclick="toast('Функция «Создать шаблон» — в разработке')">Создать шаблон</button></section><section class="card settings-card"><div class="card-title">Версия</div><div class="card-sub">Праводом.рф · CRM v3.6</div></section></div>`}
async function reload(){try{const [{data:p,error:pe},{data:s,error:se},{data:o,error:oe},{data:c,error:ce},{data:g,error:ge},{data:t,error:te},{data:a,error:ae},{data:cf,error:cfe},{data:cfv,error:cfve}]=await Promise.all([sb.from('crm_pipelines').select('*').eq('active',true).order('sort_order'),sb.from('crm_pipeline_stages').select('*').eq('active',true).order('sort_order'),sb.from('crm_organizations').select('*').is('deleted_at',null).order('created_at',{ascending:false}),sb.from('crm_cases').select('*').is('deleted_at',null).order('created_at',{ascending:false}),sb.from('crm_case_groups').select('*').order('created_at',{ascending:false}),sb.from('crm_tasks').select('*').order('due_date').order('due_time'),sb.from('crm_activities').select('*').eq('kind','comment').order('created_at',{ascending:false}),sb.from('crm_case_fields').select('*').eq('active',true).order('sort_order'),sb.from('crm_case_field_values').select('*')]);for(const e of [pe,se,oe,ce,ge,te,ae])if(e)throw e;state.pipelines=p||[];state.stages=s||[];state.orgs=o||[];state.cases=c||[];state.groups=g||[];state.tasks=t||[];state.comments=a||[];state.caseFields=cfe?[]:(cf||[]);state.caseFieldValues=cfve?[]:(cfv||[]);const {data:files,error:fe}=await sb.from('crm_case_files').select('*').order('created_at',{ascending:false});if(!fe)state.caseFiles=files||[];else console.error('crm_case_files:',fe);await assignMissingGroupColors();shell()}catch(e){console.error(e);showFatal(e)}}
async function assignMissingGroupColors(){if(groupColorSaving)return;const missing=state.groups.filter(g=>!g.color);if(!missing.length)return;groupColorSaving=true;try{const used=new Set(state.groups.map(g=>g.color).filter(Boolean));for(const g of missing){const color=GROUP_COLORS.find(c=>!used.has(c));if(!color)break;const {error}=await sb.from('crm_case_groups').update({color}).eq('id',g.id);if(!error){g.color=color;used.add(color)}}}finally{groupColorSaving=false}}
function showFatal(e){document.getElementById('root').innerHTML=`<div class="fatal"><div class="card"><h2>Праводом.рф не удалось загрузить</h2><div class="card-sub" style="margin-top:8px">CRM остановилась при загрузке данных. Ничего не отключаем и не меняем автоматически.</div><div class="section"><strong>Техническая ошибка</strong><pre style="white-space:pre-wrap;color:var(--danger)">${esc(e?.message||e)}</pre></div><button class="btn primary" onclick="location.reload()">Обновить</button></div></div>`}

  const ps=pipelineFor('case');

  document.getElementById('newCaseForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),stage=e.target.querySelector('.stage-value')?.value||stages[0]?.id,source=e.target.querySelector('.source-value')?.value||'not_set';const payload={title:f.get('title'),legal_pipeline_id:f.get('pipeline_id'),legal_stage_id:stage,debtor_name:f.get('debtor_name')||null,debtor_identifier:f.get('debtor_identifier')||null,organization_id:f.get('organization_id')||null,source,profit:f.get('profit')===''?null:Number(f.get('profit')),notes:f.get('notes')||null,owner_id:state.user.id};const {data,error}=await sb.from('crm_cases').insert(payload).select().single();if(error){toast(error.message);return}await reload();closeModal();toast('Дело создано');if(data?.id)openCase(data.id)};
