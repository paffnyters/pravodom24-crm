async function createGroupFromSelection(){const ids=[...state.groupSelected];if(ids.length<1){toast('Выберите хотя бы одно дело');return}const cases=state.cases.filter(c=>ids.includes(c.id));const orgIds=[...new Set(cases.map(c=>c.organization_id).filter(Boolean))];if(orgIds.length!==1||cases.some(c=>!c.organization_id)){toast('В группу можно объединять только дела одной организации');return}if(state.groupTargetGroupId){const g=state.groups.find(x=>x.id===state.groupTargetGroupId);if(!g||g.organization_id!==orgIds[0]){toast('Дела должны относиться к организации группы');return}const {error}=await sb.from('crm_cases').update({group_id:g.id,updated_at:new Date().toISOString()}).in('id',ids);if(error){toast(error.message);return}state.groupSelectMode=false;state.groupSelected=new Set();state.groupTargetGroupId=null;await reload();toast('Дела добавлены в группу');return}if(ids.length<2){toast('Для новой группы выберите минимум два дела');return}const name=prompt('Название группы',cases[0]?.title||'Группа');if(!name?.trim())return;const color=GROUP_COLORS.find(c=>!state.groups.some(g=>g.color===c));if(!color){toast('Все доступные цвета групп уже используются');return}const {data,error}=await sb.from('crm_case_groups').insert({name:name.trim(),organization_id:orgIds[0],color,created_by:state.user.id}).select().single();if(error){toast(error.message);return}const {error:ue}=await sb.from('crm_cases').update({group_id:data.id,updated_at:new Date().toISOString()}).in('id',ids);if(ue){toast(ue.message);return}state.groupSelectMode=false;state.groupSelected=new Set();state.groupTargetGroupId=null;await reload();toast('Группа создана')}
function fieldTypeLabel(t){return {text:'Текст',number:'Число',money:'Деньги',date:'Дата',boolean:'Да/нет',select:'Список',phone:'Телефон',email:'Email',link:'Ссылка',multiline:'Многострочный'}[t]||t}
function fieldKey(name){return String(name||'').toLowerCase().trim().replace(/[^a-zа-яё0-9]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,50)||('field_'+Date.now())}
function manageCaseFields(pid){const fields=state.caseFields.filter(f=>f.pipeline_id===pid);const p=state.pipelines.find(x=>x.id===pid);const fieldTypes=[{t:'text',label:'Текст',desc:'Короткий текст (до ~100 символов)'},{t:'multiline',label:'Многострочный текст',desc:'Длинный текст, заметки, описания'},{t:'number',label:'Число',desc:'Целое или дробное число'},{t:'money',label:'Деньги',desc:'Сумма в рублях, с копейками'},{t:'date',label:'Дата',desc:'Дата без времени'},{t:'boolean',label:'Да/Нет',desc:'Логическое значение'},{t:'select',label:'Список',desc:'Выбор одного значения из вариантов'},{t:'phone',label:'Телефон',desc:'Телефонный номер'},{t:'email',label:'Email',desc:'Адрес электронной почты'},{t:'link',label:'Ссылка',desc:'URL на внешний ресурс'}];modal(`<div class="modal-head"><div><h2>Параметры карточек</h2><div class="card-sub">${p?`Воронка «${esc(p.name)}». `:''}Эти поля появятся в карточке каждого дела этой воронки. Добавляйте поля под конкретный тип дела — например, «Номер исполнительного производства», «Дата судебного заседания», «Сумма долга».</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section" style="margin-top:16px">${fields.length?`<h3 style="margin:0 0 10px">Текущие параметры (${fields.length})</h3><div class="field-builder">${fields.map((f,i)=>`<div class="field-builder-row" style="grid-template-columns:1fr;gap:8px;border:1px solid var(--line);padding:12px;border-radius:13px;background:var(--panel2)"><div><strong style="font-size:13px">${i+1}. ${esc(f.name)}</strong><div class="card-sub" style="margin-top:3px">Тип: ${fieldTypeLabel(f.field_type)}${(f.options||[]).length?' · варианты: '+f.options.map(esc).join(', '):''}</div></div><div style="display:grid;gap:6px"><input value="${esc(f.name)}" id="fieldName_${f.id}" placeholder="Название поля" style="padding:8px 10px;border-radius:9px;border:1px solid var(--line)"><select id="fieldType_${f.id}" style="padding:8px 10px;border-radius:9px;border:1px solid var(--line)">${fieldTypes.map(ft=>`<option value="${ft.t}" ${f.field_type===ft.t?'selected':''}>${ft.label} — ${ft.desc}</option>`).join('')}</select><input class="field-options" value="${esc((f.options||[]).join(', '))}" placeholder="Варианты через запятую (только для типа «Список»)" style="padding:8px 10px;border-radius:9px;border:1px solid var(--line)"></div><div class="actions" style="display:flex;gap:6px"><button class="btn small primary" onclick="saveCaseField('${f.id}')">Сохранить</button><button class="btn small danger" onclick="archiveCaseField('${f.id}')">Убрать</button></div></div>`).join('')}</div>`:'<div class="empty" style="padding:18px;text-align:center;color:var(--muted)">Параметров пока нет. Добавьте первое поле ниже.</div>'}</div><div class="section" style="margin-top:18px"><h3 style="margin:0 0 8px">Добавить новый параметр</h3><div class="card-sub" style="margin-bottom:12px">Юрист увидит это поле в карточке дела. Лучше короткие понятные названия — «Номер ИП», «Дата заседания», «Сумма долга».</div><form id="newFieldForm" class="grid" style="gap:10px"><div class="field full"><label>Название параметра</label><input name="name" placeholder="Например, Номер исполнительного производства" required style="padding:10px 12px;border-radius:10px;border:1px solid var(--line)"></div><div class="field"><label>Тип данных</label><select name="field_type" style="padding:10px 12px;border-radius:10px;border:1px solid var(--line)">${fieldTypes.map(ft=>`<option value="${ft.t}">${ft.label} — ${ft.desc}</option>`).join('')}</select></div><div class="field"><label>Варианты (только для «Список»)</label><input name="options" placeholder="Первый вариант, Второй вариант" style="padding:10px 12px;border-radius:10px;border:1px solid var(--line)"></div><div class="field full"><button class="btn primary" style="padding:11px 18px">Добавить параметр</button></div></form></div>`,'case-modal');document.getElementById('newFieldForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),key=fieldKey(name),options=String(f.get('options')||'').split(',').map(x=>x.trim()).filter(Boolean);const {error}=await sb.from('crm_case_fields').insert({pipeline_id:pid,name,field_key:key,field_type:f.get('field_type'),options,sort_order:fields.length,created_by:state.user.id});if(error)toast(error.message);else{await reload();manageCaseFields(pid);toast('Параметр добавлен')}}}
async function saveCaseField(id){const f=state.caseFields.find(x=>x.id===id);if(!f)return;const name=document.getElementById('fieldName_'+id)?.value.trim();const type=document.getElementById('fieldType_'+id)?.value;const options=String(document.querySelector('#fieldName_'+id)?.parentElement.querySelector('.field-options')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);if(!name)return;const {error}=await sb.from('crm_case_fields').update({name,field_type:type,options}).eq('id',id);if(error)toast(error.message);else{await reload();manageCaseFields(f.pipeline_id);toast('Поле сохранено')}}
async function archiveCaseField(id){const f=state.caseFields.find(x=>x.id===id);if(!f)return;if(!confirm(`Убрать поле «${f.name}» из карточек? Данные сохранятся.`))return;const {error}=await sb.from('crm_case_fields').update({active:false}).eq('id',id);if(error)toast(error.message);else{await reload();manageCaseFields(f.pipeline_id)}}
function customCaseFieldsHtml(c,edit=false){const fields=state.caseFields.filter(f=>f.pipeline_id===c.legal_pipeline_id);return fields.map(f=>{const v=state.caseFieldValues.find(x=>x.case_id===c.id&&x.field_id===f.id)?.value_text||'';if(edit)return `<div class="field ${f.field_type==='multiline'?'full':''}"><label>${esc(f.name)}</label>${f.field_type==='select'?`<select name="cf_${f.id}"><option value="">Не указано</option>${(f.options||[]).map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.field_type==='boolean'?`<label class="checkline compact"><input type="checkbox" name="cf_${f.id}" ${v==='true'?'checked':''}><span>Да</span></label>`:f.field_type==='multiline'?`<textarea name="cf_${f.id}">${esc(v)}</textarea>`:`<input name="cf_${f.id}" type="${['number','date','email','tel','url'].includes(f.field_type)?(f.field_type==='phone'?'tel':f.field_type):'text'}" value="${esc(v)}">`}</div>`;return v?`<div class="case-field-display"><div class="edit-field-label">${esc(f.name)}</div><div class="card-view-value">${esc(v)}</div></div>`:''}).join('')}
async function saveCaseCustomFields(caseId,pipelineId,form){const fields=state.caseFields.filter(f=>f.pipeline_id===pipelineId);for(const f of fields){const el=form.querySelector(`[name="cf_${f.id}"]`);if(!el)continue;const value=f.field_type==='boolean'?(el.checked?'true':'false'):String(el.value||'');const {error}=await sb.from('crm_case_field_values').upsert({case_id:caseId,field_id:f.id,value_text:value,updated_at:new Date().toISOString()},{onConflict:'case_id,field_id'});if(error)throw error}}
function commentsHtml(type,id){const rows=(state.comments||[]).filter(x=>type==='org'?x.organization_id===id:x.case_id===id);return `<div class="comment-compose-wrap"><textarea id="newComment" class="comment-compose" placeholder="Написать комментарий..."></textarea><button class="btn comment-save" onclick="addComment('${type}','${id}')">Сохранить</button></div><div class="comment-list">${rows.map(x=>`<div class="comment-item"><div class="comment-text">${esc(x.text)}</div><div class="comment-foot"><span>${fmtDateTime(x.created_at)}</span><button class="comment-delete" onclick="deleteComment('${x.id}')">× удалить</button></div></div>`).join('')}</div>`}
async function addComment(type,id){const el=document.getElementById('newComment'),text=el?.value.trim();if(!text)return;const payload={text,kind:'comment',created_by:state.user.id};if(type==='org')payload.organization_id=id;else payload.case_id=id;const {error}=await sb.from('crm_activities').insert(payload);if(error)toast(error.message);else{await reload();type==='org'?openOrg(id):openCase(id);toast('Комментарий сохранён')}}
async function deleteComment(id){if(!confirm('Удалить комментарий?'))return;const {error}=await sb.from('crm_activities').delete().eq('id',id);if(error)toast(error.message);else{await reload();toast('Комментарий удалён')}}
async function deleteOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;modal(`<div class="modal-head"><div><h2>Удалить «${esc(o.name)}»</h2><div class="card-sub">Выберите, что сделать с карточкой клиента.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section" style="margin-top:16px"><div class="card-sub" style="margin-bottom:12px">Карточка содержит ${state.cases.filter(c=>c.organization_id===id&&!c.deleted_at).length} активных дел и связанные задачи/комментарии.</div><div class="actions" style="display:grid;gap:8px"><button class="btn" style="text-align:left;padding:12px 14px" onclick="archiveOrg('${id}')"><strong>↓ Убрать в архив</strong><div class="card-sub" style="margin-top:3px">Скрыть из воронки. Видна в разделе «Архив». Можно восстановить.</div></button><button class="btn danger" style="text-align:left;padding:12px 14px" onclick="purgeOrg('${id}')"><strong>× Удалить навсегда</strong><div class="card-sub" style="margin-top:3px">Безвозвратно. Файлы на Яндекс Диске будут удалены, дела потеряют привязку к организации.</div></button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`)}async function archiveOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;try{const {error}=await sb.from('crm_organizations').update({deleted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;closeModal();await reload();toast('Карточка в архиве')}catch(e){toast(e.message||'Не удалось архивировать')}}async function purgeOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;if(!confirm(`Удалить навсегда «${o.name}»? Это действие необратимо. Файлы и история будут потеряны.`))return;try{const caseFiles=state.caseFiles.filter(f=>state.cases.find(c=>c.id===f.case_id&&c.organization_id===id));for(const f of caseFiles){try{await yandexAction({action:'delete',path:f.yandex_path})}catch{}}const {error}=await sb.from('crm_organizations').delete().eq('id',id);if(error)throw error;closeModal();await reload();toast('Карточка удалена навсегда')}catch(e){toast(e.message||'Не удалось удалить навсегда')}}async function restoreOrg(id){try{const {error}=await sb.from('crm_organizations').update({deleted_at:null,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await reload();toast('Карточка восстановлена')}catch(e){toast(e.message||'Не удалось восстановить')}}
async function deleteCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;modal(`<div class="modal-head"><div><h2>Удалить «${esc(c.title)}»</h2><div class="card-sub">Выберите, что сделать с делом.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section" style="margin-top:16px"><div class="card-sub" style="margin-bottom:12px">Дело содержит ${state.caseFiles.filter(f=>f.case_id===id).length} файлов на Яндекс Диске и связанные задачи/комментарии.</div><div class="actions" style="display:grid;gap:8px"><button class="btn" style="text-align:left;padding:12px 14px" onclick="archiveCase('${id}')"><strong>↓ Убрать в архив</strong><div class="card-sub" style="margin-top:3px">Скрыть из воронки. Видно в разделе «Архив». Можно восстановить.</div></button><button class="btn danger" style="text-align:left;padding:12px 14px" onclick="purgeCase('${id}')"><strong>× Удалить навсегда</strong><div class="card-sub" style="margin-top:3px">Файлы на Яндекс Диске будут удалены, история потеряна. Необратимо.</div></button><button class="btn" onclick="closeModal()">Отмена</button></div></div>`)}async function archiveCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;try{const {error}=await sb.from('crm_cases').update({deleted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;closeModal();await reload();toast('Дело в архиве')}catch(e){toast(e.message||'Не удалось архивировать')}}async function purgeCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;if(!confirm(`Удалить навсегда дело «${c.title}»? Файлы с Яндекс Диска будут удалены. Действие необратимо.`))return;try{const files=state.caseFiles.filter(f=>f.case_id===id);for(const f of files){try{await yandexAction({action:'delete',path:f.yandex_path})}catch{}}const {error}=await sb.from('crm_cases').delete().eq('id',id);if(error)throw error;closeModal();await reload();toast('Дело удалено навсегда')}catch(e){toast(e.message||'Не удалось удалить навсегда')}}async function restoreCase(id){try{const {error}=await sb.from('crm_cases').update({deleted_at:null,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await reload();toast('Дело восстановлено')}catch(e){toast(e.message||'Не удалось восстановить')}}
function orgFieldView(label,value){return `<div class="field"><div class="edit-field-label">${label}</div><div class="card-view-value ${value?'':'muted'}">${value?esc(value):'Не указано'}</div></div>`}
function caseFieldView(label,value){return `<div class="field"><div class="edit-field-label">${label}</div><div class="card-view-value ${value?'':'muted'}">${value?esc(value):'Не указано'}</div></div>`}
function openOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;const stages=stagesFor(o.sales_pipeline_id),orgCases=state.cases.filter(c=>c.organization_id===id&&!c.deleted_at);const compact=state.uiMode==='compact';const stageBar=(compact&&stages.length)?`<div class="case-stage-bar"><div class="stage-switcher">${stages.map((s,i)=>{const color=STAGE_COLORS[i%STAGE_COLORS.length];const active=s.id===o.sales_stage_id;return `<button class="stage-pill${active?' active':''}" style="--pill-color:${color}" onclick="quickChangeOrgStage('${id}','${s.id}')" title="Сменить стадию на «${esc(s.name)}»">${esc(s.name)}</button>`}).join('')}</div></div>`:'';const headerActions=compact?`<div class="case-head-actions"><button class="btn small" onclick="orgBulkCreateCases('${id}')" title="Создать несколько дел">+ Создать дела</button><button class="btn small" onclick="newTask('${todayKey()}','${id}')" title="Поставить задачу">+ Задача</button><button class="btn small" onclick="editOrg('${id}')" title="Редактировать">Редактировать</button><button class="close" onclick="closeModal()">×</button></div>`:`<button class="close" onclick="closeModal()">×</button>`;const actionSection=compact?'':`<div class="section"><div class="actions"><button class="btn" onclick="newTask('${todayKey()}','${id}')">Задача</button><button class="btn" onclick="editOrg('${id}')">Редактировать</button><button class="btn" onclick="orgBulkCreateCases('${id}')">+ Создать дела</button></div></div>`;const deleteRow=compact?'':`<div class="delete-row"><button class="btn danger small" onclick="deleteOrg('${id}')">Удалить карточку</button></div>`;const layoutId=compact?'id="caseLayout"':'';const resizer=compact?'<div class="detail-resizer" id="caseResizer" title="Потяните, чтобы изменить ширину"></div>':'';const layoutClass=compact?'detail-layout modal-card-layout':'detail-layout modal-card-layout';const mainClass=compact?'detail-main':'';const sideClass=compact?'detail-side':'';const marginTop=compact?'6px':'14px';modal(`<div class="modal-head ${compact?'case-head':''}"><div class="${compact?'case-head-info':''}"><h2>${esc(o.name)}</h2><div class="card-sub">${o.contact_name?esc(o.contact_name):'Контакт не указан'}</div></div>${headerActions}</div>${stageBar}<div class="${layoutClass}" ${layoutId} style="margin-top:${marginTop}"><div class="${mainClass}"><div class="section" style="margin-top:0;padding-top:0;border-top:0"><h3>Продажи</h3>${stageReadOnly(stages,o.sales_stage_id)}</div><div class="section"><h3>Источник</h3>${sourceReadOnly(o.source||'not_set')}</div><div class="section"><h3>Стоимость услуг</h3><div class="card-view-value ${o.service_cost_unknown!==false?'muted':''}">${o.service_cost_unknown!==false?'?':fmtMoney(o.service_cost)}</div></div>${o.phone||o.email||o.inn||o.telegram||o.website?`<div class="section"><h3>Контакты</h3><div class="list">${o.phone?orgFieldView('Телефон',o.phone):''}${o.email?orgFieldView('Email',o.email):''}${o.telegram?orgFieldView('Telegram',o.telegram):''}${o.website?orgFieldView('Сайт',o.website):''}${o.inn?orgFieldView('ИНН',o.inn):''}</div></div>`:''}${o.position?`<div class="section">${orgFieldView('Должность',o.position)}</div>`:''}${o.max_contact?`<div class="section">${orgFieldView('Дополнительный контакт',o.max_contact)}</div>`:''}${orgCases.length?`<div class="section"><h3>Дела (${orgCases.length})</h3><div class="multi">${orgCases.map(c=>`<button class="btn small" onclick="openCase('${c.id}')">${esc(c.title)}</button>`).join('')}</div></div>`:''}${o.notes?`<div class="section">${orgFieldView('Заметка',o.notes)}</div>`:''}${actionSection}${deleteRow}</div>${resizer}<div class="${sideClass}"><h3 style="margin-top:0">Комментарии</h3>${commentsHtml('org',id)}</div></div>`,'case-modal');if(compact)initCaseResizer()}async function quickChangeOrgStage(orgId,stageId){try{const {error}=await sb.from('crm_organizations').update({sales_stage_id:stageId,updated_at:new Date().toISOString()}).eq('id',orgId);if(error)throw error;const o=state.orgs.find(x=>x.id===orgId);if(o){o.sales_stage_id=stageId;o.updated_at=new Date().toISOString()}openOrg(orgId);toast('Стадия изменена')}catch(e){console.error(e);toast(e.message||'Не удалось сменить стадию')}}async function orgBulkCreateCases(orgId){const o=state.orgs.find(x=>x.id===orgId);if(!o)return;const casePipelines=state.pipelines.filter(p=>p.entity_type==='case');const p=casePipelines[0];const stages=stagesFor(p?.id);modal(`<div class="modal-head"><div><h2>Создать дела для «${esc(o.name)}»</h2><div class="card-sub">Каждая строка — отдельное дело. Все будут привязаны к этому клиенту.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="orgBulkForm" style="margin-top:16px;display:grid;gap:10px">${p?`<div class="field"><label>Юридическая воронка</label><select name="pipeline_id">${casePipelines.map(pp=>`<option value="${pp.id}" ${pp.id===p.id?'selected':''}>${esc(pp.name)}</option>`).join('')}</select></div><div class="field"><label>Стадия</label><select name="stage_id">${stages.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>`:'<div class="card-sub">Сначала создайте юридическую воронку.</div>'}<div class="field full"><label>Названия дел (по одному на строку)</label><textarea class="bulk-textarea" name="titles" placeholder="Иванов И.И. — взыскание алиментов&#10;Петров П.П. — расторжение договора" required></textarea></div><div class="field full"><button class="btn primary" ${p?'':'disabled'}>Создать дела</button></div></form>`,'case-modal');document.getElementById('orgBulkForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const pipelineId=f.get('pipeline_id');const stageId=f.get('stage_id');const titles=String(f.get('titles')||'').split('\n').map(t=>t.trim()).filter(Boolean);if(!titles.length){toast('Введите хотя бы одно название');return}try{let created=0;for(const title of titles){const {error}=await sb.from('crm_cases').insert({title,legal_pipeline_id:pipelineId,legal_stage_id:stageId,organization_id:orgId,owner_id:state.user.id});if(error)throw error;created++;if(created%5===0)toast(`Создано ${created} из ${titles.length}...`)}await reload();closeModal();toast(`Создано ${titles.length} дел для «${o.name}»`)}catch(err){toast(err.message||'Ошибка при создании дел')}}}
function diskCasePath(c){const org=state.orgs.find(o=>o.id===c.organization_id);const safe=v=>String(v||'Без названия').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,140)||'Без названия';const same=state.cases.filter(x=>x.id!==c.id&&x.organization_id===c.organization_id&&x.title===c.title);const folder=safe(c.title)+(same.length?` [${c.id.slice(0,8)}]`:'');return `CRM Праводом.рф/${safe(org?.name||'Без организации')}/${folder}/документы`}
function fmtBytes(n){if(!n&&n!==0)return '';const u=['Б','КБ','МБ','ГБ'];let x=Number(n),i=0;while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x.toFixed(i?1:0)} ${u[i]}`}
function documentsHtml(caseId){const rows=state.caseFiles.filter(f=>f.case_id===caseId);return `<div class="documents-box"><div class="modal-head" style="align-items:center"><div><h3 style="margin:0">Документы</h3><div class="card-sub">Файлы хранятся на Яндекс Диске в папке дела.</div></div><div class="actions"><label class="btn small upload-label">+ Добавить файл<input type="file" multiple hidden onchange="uploadCaseFiles('${caseId}',this.files);this.value='' "></label></div></div><div class="document-list">${rows.map(f=>{const m=(f.mime_type||'').toLowerCase();const canPreview=m==='application/pdf'||m.startsWith('image/')||m.startsWith('text/')||isWordDocx(m,f.name)||isExcelMime(m,f.name);return `<div class="document-row"><div class="document-main"><div class="document-name" title="${esc(f.name)}">${esc(f.name)}</div><div class="document-meta">${fmtBytes(f.size)}</div></div><div class="document-actions">${canPreview?`<button class="btn" onclick="openCaseFile('${f.id}')">Открыть</button>`:''}<button class="btn" onclick="downloadCaseFile('${f.id}')">Скачать</button><button class="btn danger" onclick="deleteCaseFile('${f.id}')">Удалить</button></div></div>`}).join('')||'<div class="empty">Документов пока нет.</div>'}</div></div>`}
async function refreshCaseFiles(caseId){const {data,error}=await sb.from('crm_case_files').select('*').eq('case_id',caseId).order('created_at',{ascending:false});if(error){toast('Не удалось обновить документы: '+error.message);return}state.caseFiles=state.caseFiles.filter(f=>f.case_id!==caseId).concat(data||[]);openCase(caseId)}
async function yandexAction(body){const {data,error}=await sb.functions.invoke('yandex-disk',{body});if(error){let detail='';try{const ctx=error.context;if(ctx?.clone){const r=await ctx.clone();detail=await r.text()}else if(ctx?.text)detail=await ctx.text()}catch{}throw new Error(detail||error.message||'Ошибка Edge Function')}if(!data?.ok)throw new Error(typeof data?.error==='string'?data.error:JSON.stringify(data?.error||data));return data}
async function ensureCaseDiskFolder(c){return yandexAction({action:'prepare_case',path:diskCasePath(c)})}
async function uploadCaseFiles(caseId,fileList){const c=state.cases.find(x=>x.id===caseId);if(!c||!fileList?.length)return;const files=[...fileList];let cancelled=false;const cancelBtn=document.createElement('button');cancelBtn.className='upload-progress-cancel';cancelBtn.textContent='×';cancelBtn.onclick=()=>{cancelled=true;toast('Загрузка отменена')};try{await ensureCaseDiskFolder(c);showUploadProgress(files.length,cancelBtn);for(let i=0;i<files.length;i++){if(cancelled)throw new Error('Загрузка отменена пользователем');const file=files[i];if(!file.size)throw new Error(`Файл «${file.name}» имеет размер 0 байт.`);updateUploadProgress(i+1,files.length,file.name,0);const cleanName=file.name.replace(/[\/:*?"<>|]+/g,' ').trim()||'Файл';const path=`${diskCasePath(c)}/${cleanName}`;const hrefData=await yandexAction({action:'upload_href',path});if(!hrefData?.href)throw new Error('Яндекс Диск не выдал адрес загрузки.');await uploadFileWithProgress(hrefData.href,file,(p)=>updateUploadProgress(i+1,files.length,file.name,p));const verify=await yandexAction({action:'verify',path,mime_type:file.type||'application/octet-stream'});const actualSize=Number(verify?.size||0);if(actualSize!==file.size)throw new Error(`Файл «${file.name}» загружен некорректно: отправлено ${file.size} байт, на Яндексе ${actualSize} байт.`);const resourceId=verify?.resource_id||null;const storedMime=verify?.mime_type||file.type||null;const {data:inserted,error:dbError}=await sb.from('crm_case_files').insert({case_id:caseId,name:file.name,yandex_path:path,yandex_resource_id:resourceId,mime_type:storedMime,size:actualSize,created_by:state.user.id}).select('*').single();if(dbError)throw new Error('Файл загружен на Яндекс Диск, но запись в CRM не создана: '+dbError.message);state.caseFiles=[inserted,...state.caseFiles.filter(x=>x.id!==inserted.id)]}hideUploadProgress();openCase(caseId);toast('Файлы загружены в CRM')}catch(e){hideUploadProgress();console.error(e);toast(e.message||'Не удалось загрузить файл')}}function uploadFileWithProgress(url,file,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',url,true);xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');xhr.upload.onprogress=(e)=>{if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total)};xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)resolve();else reject(new Error(`Ошибка загрузки на Яндекс Диск (${xhr.status}): ${xhr.responseText||'нет тела'}`))};xhr.onerror=()=>reject(new Error('Сетевая ошибка при загрузке на Яндекс Диск. Возможные причины: CORS на стороне Яндекса, нет интернета, VPN блокирует uploader.disk.yandex.net.'));xhr.ontimeout=()=>reject(new Error('Таймаут при загрузке файла на Яндекс Диск.'));xhr.timeout=1800000;xhr.send(file)})}function showUploadProgress(total,cancelBtn){let p=document.getElementById('uploadProgressBox');if(!p){p=document.createElement('div');p.id='uploadProgressBox';p.className='upload-progress';document.body.appendChild(p)}p.innerHTML=`<div class="upload-progress-title">Загрузка файлов</div><div class="upload-progress-name" id="upName">Подготовка...</div><div class="upload-progress-bar"><div class="upload-progress-bar-fill" id="upFill"></div></div><div class="upload-progress-stat" id="upStat">${total} файл(ов)</div>`;p.appendChild(cancelBtn)}function updateUploadProgress(idx,total,name,frac){const fill=document.getElementById('upFill');const stat=document.getElementById('upStat');const nm=document.getElementById('upName');if(nm)nm.textContent=`${idx}/${total}: ${name}`;if(fill)fill.style.width=Math.round(frac*100)+'%';if(stat)stat.textContent=Math.round(frac*100)+'%'}function hideUploadProgress(){const p=document.getElementById('uploadProgressBox');if(p)p.remove()}

async function fetchFileBlob(f,download){const {data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw new Error('Сессия CRM истекла. Войдите заново.');const res=await fetch(`${SUPABASE_URL}/functions/v1/yandex-disk`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'proxy',path:f.yandex_path,name:f.name,mime_type:f.mime_type||'application/octet-stream',download:download})});if(!res.ok){let detail='';try{detail=await res.text()}catch{}throw new Error(detail||`Ошибка получения файла (${res.status})`)}const blob=await res.blob();if(!blob.size)throw new Error('CRM получила пустой файл от Яндекс Диска.');return blob}async function downloadCaseFile(fileId){const f=state.caseFiles.find(x=>x.id===fileId);if(!f)return;try{toast('Готовим файл...');const blob=await fetchFileBlob(f,true);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),180000)}catch(e){console.error(e);toast(e.message||'Не удалось скачать файл')}}async function openCaseFile(fileId){return previewCaseFile(fileId)}async function previewCaseFile(fileId){const f=state.caseFiles.find(x=>x.id===fileId);if(!f)return;openPreviewModal(f);try{const blob=await fetchFileBlob(f,false);await renderPreviewContent(f,blob)}catch(e){console.error(e);renderPreviewError(f,e)}}function openPreviewModal(f){closePreviewModal();const overlay=document.createElement('div');overlay.className='overlay show preview-overlay';overlay.id='previewOverlay';overlay.innerHTML=`<div class="modal preview-modal"><div class="modal-head"><div style="min-width:0;overflow:hidden"><h2 style="margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</h2><div class="card-sub">${fmtBytes(f.size)}</div></div><div class="actions" style="flex:none"><button class="btn small" onclick="downloadCaseFile('${f.id}')">Скачать</button><button class="close" onclick="closePreviewModal()">×</button></div></div><div class="preview-content" id="previewContent"><div class="preview-loading"><div class="spinner"></div>Загрузка файла с Яндекс Диска...</div></div></div>`;overlay.onclick=(e)=>{if(e.target===overlay)closePreviewModal()};document.body.appendChild(overlay)}function closePreviewModal(){const overlay=document.getElementById('previewOverlay');if(!overlay)return;const iframe=overlay.querySelector('iframe');const img=overlay.querySelector('img');if(iframe&&iframe.src.startsWith('blob:'))URL.revokeObjectURL(iframe.src);if(img&&img.src.startsWith('blob:'))URL.revokeObjectURL(img.src);overlay.remove()}function isWordDocx(m,name){m=(m||'').toLowerCase();if(m==='application/vnd.openxmlformats-officedocument.wordprocessingml.document')return true;if(m==='application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml')return true;if(m==='application/wps-office.docx')return true;return /\.docx$/i.test(name||'')}function isOldWord(m,name){m=(m||'').toLowerCase();if(m==='application/msword')return true;return /\.doc$/i.test(name||'')&&!/\.docx$/i.test(name||'')}function isExcelMime(m,name){m=(m||'').toLowerCase();if(m.includes('spreadsheet')||m.includes('excel')||m.includes('ms-excel')||m==='application/vnd.ms-excel'||m==='text/csv')return true;return /\.(xlsx|xls|ods|csv)$/i.test(name||'')}function isPptMime(m,name){m=(m||'').toLowerCase();if(m.includes('presentation')||m.includes('powerpoint')||m.includes('ms-powerpoint'))return true;return /\.(pptx?|odp)$/i.test(name||'')}async function renderPreviewContent(f,blob){const el=document.getElementById('previewContent');if(!el)return;const m=(f.mime_type||'').toLowerCase();const setUrl=(html,url)=>{el.innerHTML=html;el.dataset.blobUrl=url};if(m==='application/pdf'||m==='text/pdf'){const u=URL.createObjectURL(blob);setUrl(`<iframe src="${u}" title="${esc(f.name)}" allowfullscreen></iframe>`,u)}else if(m.startsWith('image/')){const u=URL.createObjectURL(blob);setUrl(`<img src="${u}" alt="${esc(f.name)}" />`,u)}else if(m.startsWith('text/')||m==='text/csv'||m==='text/html'||m==='application/json'){const u=URL.createObjectURL(blob);setUrl(`<iframe src="${u}" title="${esc(f.name)}"></iframe>`,u)}else if(isWordDocx(m,f.name)){if(typeof docx==='undefined'||!docx.renderAsync){renderPreviewError(f,new Error('Библиотека docx-preview не загрузилась с CDN. Проверьте интернет-соединение или попробуйте обновить страницу.'));return}el.innerHTML='<div class="preview-loading"><div class="spinner"></div>Рендеринг Word-документа...</div>';await new Promise(r=>setTimeout(r,30));el.innerHTML='';const container=document.createElement('div');container.className='docx-container';el.appendChild(container);try{await docx.renderAsync(blob,container,null,{inWrapper:true,renderHeaders:true,renderFooters:true,ignoreWidth:false,ignoreHeight:false,ignoreLastRenderedPageBreak:false,useBase64URL:true})}catch(err){console.error('docx-preview render error:',err);renderPreviewError(f,new Error('Не удалось отрендерить .docx в браузере. '+((err&&err.message)||'')+'. Возможно файл повреждён или это старый .doc вместо .docx — попробуйте пересохранить как .docx в Word.'))}}else if(isOldWord(m,f.name)){el.innerHTML=`<div class="preview-unsupported"><div class="preview-unsupported-icon">📄</div><div class="preview-unsupported-title">Старый формат .doc</div><div class="preview-unsupported-text">Файлы .doc (Word 97–2003) нельзя открыть в браузере — поддерживается только современный .docx. Откройте файл в Word и сохраните как .docx, либо скачайте для просмотра.</div><button class="btn primary" onclick="downloadCaseFile('${f.id}')">Скачать файл</button></div>`}else if(isExcelMime(m,f.name)){if(typeof XLSX==='undefined'||!XLSX.read){renderPreviewError(f,new Error('Библиотека SheetJS (xlsx) не загрузилась с CDN. Проверьте интернет-соединение или обновите страницу.'));return}el.innerHTML='<div class="preview-loading"><div class="spinner"></div>Чтение таблицы...</div>';await new Promise(r=>setTimeout(r,30));el.innerHTML='';const wrap=document.createElement('div');wrap.className='xlsx-wrap';const tabs=document.createElement('div');tabs.className='xlsx-tabs';const content=document.createElement('div');content.className='xlsx-content';wrap.appendChild(tabs);wrap.appendChild(content);el.appendChild(wrap);try{const buf=await blob.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const sheetNames=wb.SheetNames||[];if(!sheetNames.length)throw new Error('В файле нет листов');const showSheet=(name)=>{const ws=wb.Sheets[name];if(!ws)return;content.innerHTML=XLSX.utils.sheet_to_html(ws,{editable:false});tabs.querySelectorAll('.xlsx-tab').forEach(t=>t.classList.toggle('active',t.dataset.sheet===name))};sheetNames.forEach((name,i)=>{const tab=document.createElement('button');tab.className='xlsx-tab'+(i===0?' active':'');tab.textContent=name;tab.dataset.sheet=name;tab.onclick=()=>showSheet(name);tabs.appendChild(tab)});showSheet(sheetNames[0])}catch(err){console.error('xlsx render error:',err);renderPreviewError(f,new Error('Не удалось прочитать таблицу. '+((err&&err.message)||'')+'. Возможно файл повреждён или это не XLSX/XLS/ODS/CSV — попробуйте пересохранить в Excel.'))}}else if(isPptMime(m,f.name)){el.innerHTML=`<div class="preview-unsupported"><div class="preview-unsupported-icon">📽️</div><div class="preview-unsupported-title">Предпросмотр PowerPoint недоступен</div><div class="preview-unsupported-text">PPTX нельзя открыть прямо в браузере — у Microsoft нет встроенного просмотрщика для этого формата. Скачайте файл и откройте в PowerPoint или LibreOffice.</div><button class="btn primary" onclick="downloadCaseFile('${f.id}')">Скачать файл</button></div>`}else{el.innerHTML=`<div class="preview-unsupported"><div class="preview-unsupported-icon">📄</div><div class="preview-unsupported-title">Предпросмотр недоступен</div><div class="preview-unsupported-text">Этот тип файла (${esc(m||'неизвестен')}) нельзя открыть в браузере. Скачайте файл для просмотра.</div><button class="btn primary" onclick="downloadCaseFile('${f.id}')">Скачать файл</button></div>`}}function renderPreviewError(f,e){const el=document.getElementById('previewContent');if(!el)return;el.innerHTML=`<div class="preview-unsupported"><div class="preview-unsupported-icon">⚠️</div><div class="preview-unsupported-title">Не удалось загрузить файл</div><div class="preview-unsupported-text">${esc(e.message||'Неизвестная ошибка при получении файла с Яндекс Диска.')}</div><div style="display:flex;gap:8px"><button class="btn" onclick="previewCaseFile('${f.id}')">Повторить</button><button class="btn primary" onclick="downloadCaseFile('${f.id}')">Скачать</button></div></div>`}
async function renameCaseFile(fileId){const f=state.caseFiles.find(x=>x.id===fileId);if(!f)return;const next=prompt('Новое имя файла',f.name);if(next===null)return;const name=next.replace(/[\\/:*?"<>|]+/g,' ').trim();if(!name||name===f.name)return;const base=f.yandex_path.slice(0,f.yandex_path.lastIndexOf('/')+1),newPath=base+name;try{await yandexAction({action:'rename',path:f.yandex_path,new_path:newPath});const {data,error}=await sb.from('crm_case_files').update({name,yandex_path:newPath}).eq('id',fileId).select('*').single();if(error)throw error;if(data)state.caseFiles=state.caseFiles.map(x=>x.id===fileId?data:x);openCase(f.case_id);toast('Файл переименован')}catch(e){toast(e.message||'Не удалось переименовать файл')}}
async function deleteCaseFile(fileId){const f=state.caseFiles.find(x=>x.id===fileId);if(!f)return;if(!confirm(`Удалить файл «${f.name}»?`))return;try{await yandexAction({action:'delete',path:f.yandex_path});const {error}=await sb.from('crm_case_files').delete().eq('id',fileId);if(error)throw error;state.caseFiles=state.caseFiles.filter(x=>x.id!==fileId);openCase(f.case_id);toast('Файл удалён')}catch(e){toast(e.message||'Не удалось удалить файл')}}
function openCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;const stages=stagesFor(c.legal_pipeline_id),group=c.group_id?state.groups.find(g=>g.id===c.group_id):null,org=c.organization_id?state.orgs.find(o=>o.id===c.organization_id):null;const compact=state.uiMode==='compact';if(!compact){modal(`<div class="modal-head"><div><h2>${esc(c.title)}</h2><div class="card-sub">${c.debtor_name?esc(c.debtor_name):'Должник не указан'}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="detail-layout modal-card-layout" style="margin-top:14px"><div><div class="section" style="margin-top:0;padding-top:0;border-top:0"><h3>Юридический этап</h3>${stageReadOnly(stages,c.legal_stage_id)}</div><div class="section"><h3>Источник</h3>${sourceReadOnly(c.source||'not_set')}</div>${c.profit!==null&&c.profit!==undefined?`<div class="section"><h3>Прибыль</h3><div class="card-view-value">${fmtMoney(c.profit)}</div></div>`:''}${org?`<div class="section"><h3>Организация</h3><button class="btn" onclick="openOrg('${org.id}')">${esc(org.name)}</button></div>`:''}${group?`<div class="section"><h3>Группа</h3><button class="btn" onclick="openGroup('${group.id}')">${esc(group.name)}</button></div>`:''}<div class="section"><div class="list">${caseFieldView('Должник',c.debtor_name)}${caseFieldView('Идентификатор',c.debtor_identifier)}${c.notes?caseFieldView('Заметка',c.notes):''}${customCaseFieldsHtml(c)}</div></div><div class="section"><div class="actions"><button class="btn" onclick="newTask('${todayKey()}','${org?.id||''}','${id}')">Поставить задачу</button><button class="btn" onclick="editCase('${id}')">Редактировать</button></div></div><div class="delete-row"><button class="btn danger small" onclick="deleteCase('${id}')">Удалить карточку</button></div></div><div class="detail-side"><h3 style="margin-top:0">Комментарии</h3>${commentsHtml('case',id)}${documentsHtml(id)}</div></div>`,'case-modal');return}const stageBar=stages.length?`<div class="case-stage-bar">${renderStageSwitcher(stages,c.legal_stage_id,id)}</div>`:'';modal(`<div class="modal-head case-head"><div class="case-head-info"><h2>${esc(c.title)}</h2><div class="card-sub">${c.debtor_name?esc(c.debtor_name):'Должник не указан'}</div></div><div class="case-head-actions"><button class="btn small" onclick="newTask('${todayKey()}','${org?.id||''}','${id}')" title="Поставить задачу">+ Задача</button><button class="btn small" onclick="editCase('${id}')" title="Редактировать">Редактировать</button><button class="close" onclick="closeModal()">×</button></div></div>${stageBar}<div class="detail-layout modal-card-layout" id="caseLayout" style="margin-top:6px"><div class="detail-main"><div class="section" style="margin-top:0;padding-top:0;border-top:0"><h3>Юридический этап</h3>${stageReadOnly(stages,c.legal_stage_id)}</div><div class="section"><h3>Источник</h3>${sourceReadOnly(c.source||'not_set')}</div>${c.profit!==null&&c.profit!==undefined?`<div class="section"><h3>Прибыль</h3><div class="card-view-value">${fmtMoney(c.profit)}</div></div>`:''}${org?`<div class="section"><h3>Организация</h3><button class="btn" onclick="openOrg('${org.id}')">${esc(org.name)}</button></div>`:''}${group?`<div class="section"><h3>Группа</h3><button class="btn" onclick="openGroup('${group.id}')">${esc(group.name)}</button></div>`:''}<div class="section"><div class="list">${caseFieldView('Должник',c.debtor_name)}${caseFieldView('Идентификатор',c.debtor_identifier)}${c.notes?caseFieldView('Заметка',c.notes):''}${customCaseFieldsHtml(c)}</div></div><div class="delete-row"><button class="btn danger small" onclick="deleteCase('${id}')">Удалить карточку</button></div></div><div class="detail-resizer" id="caseResizer" title="Потяните, чтобы изменить ширину"></div><div class="detail-side"><h3 style="margin-top:0">Комментарии</h3>${commentsHtml('case',id)}${documentsHtml(id)}</div></div>`,'case-modal');initCaseResizer()}function renderStageSwitcher(stages,currentId,caseId){return `<div class="stage-switcher">${stages.map((s,i)=>{const color=STAGE_COLORS[i%STAGE_COLORS.length];const active=s.id===currentId;return `<button class="stage-pill${active?' active':''}" style="--pill-color:${color}" onclick="quickChangeStage('${caseId}','${s.id}')" title="Сменить стадию на «${esc(s.name)}»">${esc(s.name)}</button>`}).join('')}</div>`}async function quickChangeStage(caseId,stageId){try{const {error}=await sb.from('crm_cases').update({legal_stage_id:stageId,updated_at:new Date().toISOString()}).eq('id',caseId);if(error)throw error;const c=state.cases.find(x=>x.id===caseId);if(c){c.legal_stage_id=stageId;c.updated_at=new Date().toISOString()}openCase(caseId);toast('Стадия изменена')}catch(e){console.error(e);toast(e.message||'Не удалось сменить стадию')}}function initCaseResizer(){const layout=document.getElementById('caseLayout');if(!layout)return;const resizer=document.getElementById('caseResizer');if(!resizer)return;const saved=localStorage.getItem('pravodom_case_split');if(saved){try{layout.style.gridTemplateColumns=saved}catch{}}let dragging=false,startX=0,startSideW=0,totalW=0;const onDown=(e)=>{dragging=true;e.preventDefault();document.body.style.cursor='col-resize';document.body.style.userSelect='none';const side=layout.querySelector('.detail-side');startX=e.clientX;startSideW=side.getBoundingClientRect().width;totalW=layout.getBoundingClientRect().width;resizer.classList.add('active')};const onMove=(e)=>{if(!dragging)return;const dx=e.clientX-startX;let newSideW=Math.max(280,Math.min(totalW*0.75,startSideW-dx));const pct=(newSideW/totalW)*100;layout.style.gridTemplateColumns=`minmax(0,${(100-pct-1).toFixed(2)}fr) 6px ${pct.toFixed(2)}%`};const onUp=()=>{if(!dragging)return;dragging=false;document.body.style.cursor='';document.body.style.userSelect='';resizer.classList.remove('active');const cs=layout.style.gridTemplateColumns;if(cs&&cs.includes('6px'))localStorage.setItem('pravodom_case_split',cs)};resizer.addEventListener('mousedown',onDown);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp)}

function editOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;const stages=stagesFor(o.sales_pipeline_id);modal(`<div class="modal-head"><div><h2>Редактирование организации</h2><div class="card-sub">Изменения сохранятся только после нажатия «Сохранить».</div></div><button class="close" onclick="openOrg('${id}')">×</button></div><form id="editOrgForm" class="edit-panel" style="margin-top:16px"><div class="grid"><div class="field full"><label>Название организации</label><input name="name" value="${esc(o.name)}" required></div><div class="field"><label>Контакт</label><input name="contact_name" value="${esc(o.contact_name||'')}"></div><div class="field"><label>Должность</label><input name="position" value="${esc(o.position||'')}"></div><div class="field"><label>Телефон</label><input name="phone" value="${esc(o.phone||'')}"></div><div class="field"><label>Email</label><input name="email" value="${esc(o.email||'')}"></div><div class="field"><label>Telegram</label><input name="telegram" value="${esc(o.telegram||'')}"></div><div class="field"><label>Дополнительный контакт</label><input name="max_contact" value="${esc(o.max_contact||'')}"></div><div class="field"><label>Сайт</label><input name="website" value="${esc(o.website||'')}"></div><div class="field"><label>ИНН</label><input name="inn" value="${esc(o.inn||'')}"></div><div class="field"><label>Продажи</label>${stagePicker(stages,o.sales_stage_id)}</div><div class="field"><label>Источник</label>${sourceButtons(o.source||'not_set','editOrgSource')}</div><div class="field full"><label>Стоимость услуг</label><div class="cost-editor"><input id="editOrgCost" name="service_cost" type="number" step="0.01" value="${esc(o.service_cost??'')}" placeholder="Сумма" ${o.service_cost_unknown!==false?'disabled':''}><label class="checkline compact"><input id="editOrgUnknown" type="checkbox" ${o.service_cost_unknown!==false?'checked':''}><span>Неизвестно</span></label></div></div><div class="field full"><label>Заметка</label><textarea name="notes">${esc(o.notes||'')}</textarea></div></div><div class="edit-actions"><button type="button" class="btn cancel-card" onclick="openOrg('${id}')">Отмена</button><button class="btn save-card">Сохранить</button></div></form>`);const u=document.getElementById('editOrgUnknown'),cost=document.getElementById('editOrgCost');const sync=()=>{cost.disabled=u.checked;if(u.checked)cost.value=''};u.onchange=sync;cost.oninput=()=>{if(cost.value){u.checked=false;cost.disabled=false}};document.getElementById('editOrgForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),stage=e.target.querySelector('.stage-value')?.value||o.sales_stage_id,source=e.target.querySelector('.source-value')?.value||o.source||'not_set';const payload={name:f.get('name'),contact_name:f.get('contact_name')||null,position:f.get('position')||null,phone:f.get('phone')||null,email:f.get('email')||null,telegram:f.get('telegram')||null,max_contact:f.get('max_contact')||null,website:f.get('website')||null,inn:f.get('inn')||null,notes:f.get('notes')||null,sales_stage_id:stage,source,service_cost_unknown:u.checked,service_cost:u.checked||!f.get('service_cost')?null:Number(f.get('service_cost')),updated_at:new Date().toISOString()};const {error}=await sb.from('crm_organizations').update(payload).eq('id',id);if(error){toast(error.message);return}await reload();openOrg(id);toast('Изменения сохранены')}}
function editCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;const stages=stagesFor(c.legal_pipeline_id),orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===c.organization_id?'selected':''}>${esc(o.name)}</option>`).join('');modal(`<div class="modal-head"><div><h2>Редактирование дела</h2><div class="card-sub">Набор полей можно менять под каждую юридическую воронку.</div></div><button class="close" onclick="openCase('${id}')">×</button></div><form id="editCaseForm" class="edit-panel" style="margin-top:16px"><div class="grid"><div class="field full"><label>Название дела</label><input name="title" value="${esc(c.title)}" required></div><div class="field"><label>Юридический этап</label>${stagePicker(stages,c.legal_stage_id)}</div><div class="field"><label>Источник</label>${sourceButtons(c.source||'not_set')}</div><div class="field"><label>Должник</label><input name="debtor_name" value="${esc(c.debtor_name||'')}"></div><div class="field"><label>Идентификатор</label><input name="debtor_identifier" value="${esc(c.debtor_identifier||'')}"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Прибыль</label><input name="profit" type="number" step="0.01" value="${esc(c.profit??'')}" placeholder="Сумма"></div><div class="field full"><label>Заметка</label><textarea name="notes">${esc(c.notes||'')}</textarea></div>${customCaseFieldsHtml(c,true)}</div><div class="edit-actions"><button type="button" class="btn cancel-card" onclick="openCase('${id}')">Отмена</button><button class="btn save-card">Сохранить</button></div></form>`,'case-modal');document.getElementById('editCaseForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),stage=e.target.querySelector('.stage-value')?.value||c.legal_stage_id,source=e.target.querySelector('.source-value')?.value||c.source||'not_set';const payload={title:f.get('title'),debtor_name:f.get('debtor_name')||null,debtor_identifier:f.get('debtor_identifier')||null,legal_stage_id:stage,source,organization_id:f.get('organization_id')||null,profit:f.get('profit')===''?null:Number(f.get('profit')),notes:f.get('notes')||null,updated_at:new Date().toISOString()};const {error}=await sb.from('crm_cases').update(payload).eq('id',id);if(error)throw error;await saveCaseCustomFields(id,c.legal_pipeline_id,e.target);await reload();openCase(id);toast('Изменения сохранены')}catch(err){toast(err.message||'Не удалось сохранить')}}}
function openGroup(id){const g=state.groups.find(x=>x.id===id),cs=state.cases.filter(c=>c.group_id===id);const pipelineId=cs[0]?.legal_pipeline_id||state.pipelines.find(p=>p.entity_type==='case')?.id;const pipeline=state.pipelines.find(p=>p.id===pipelineId);const stages=stagesFor(pipelineId);const fields=state.caseFields.filter(f=>f.pipeline_id===pipelineId);modal(`<div class="modal-head"><div><h2>${esc(g?.name||'Группа')}</h2><div class="card-sub">${cs.length} самостоятельных дел · одна организация</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section" style="margin-top:16px"><div class="bulk-actions"><button class="btn small" onclick="groupBulkFillFields('${id}')" title="Заполнить одинаковое значение в выбранное поле для всех дел группы">📝 Заполнить поле</button><button class="btn small" onclick="groupBulkChangeStage('${id}')" title="Перевести все дела группы на выбранную стадию">↻ Сменить стадию</button><button class="btn small" onclick="groupBulkCreateCases('${id}')" title="Создать сразу несколько дел в эту группу">+ Создать дела</button></div></div><div class="actions" style="margin-bottom:10px"><button class="btn small" onclick="closeModal();startGroupSelection('${pipelineId}','${id}')">+ Добавить дела</button></div><div class="section"><h3>Дела группы</h3><div class="list">${cs.map(c=>{const stage=stages.find(s=>s.id===c.legal_stage_id);return `<div class="row"><div><strong>${esc(c.title)}</strong><div class="card-sub">${c.debtor_name?esc(c.debtor_name):''}${stage?' · '+esc(stage.name):''}</div></div><button class="btn small" onclick="openCase('${c.id}')">Открыть</button></div>`}).join('')||'<div class="empty">Пока нет карточек.</div>'}</div></div>`, 'case-modal')}async function groupBulkFillFields(groupId){const cs=state.cases.filter(c=>c.group_id===groupId);const first=cs[0];if(!first){toast('В группе нет дел');return}const pipelineId=first.legal_pipeline_id;const fields=state.caseFields.filter(f=>f.pipeline_id===pipelineId);if(!fields.length){toast('У этой воронки нет настраиваемых полей. Добавьте их через «Параметры карточек».');return}modal(`<div class="modal-head"><div><h2>Массовое заполнение полей</h2><div class="card-sub">Выберите поле и введите значение — оно применится ко всем ${cs.length} делам группы.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="bulkFillForm" style="margin-top:16px;display:grid;gap:10px"><div class="field"><label>Поле</label><select name="field_id" id="bulkFieldSel" onchange="document.getElementById('bulkFieldInput').style.display=this.options[this.selectedIndex].dataset.type==='boolean'?'none':'block';document.getElementById('bulkFieldCheck').style.display=this.options[this.selectedIndex].dataset.type==='boolean'?'block':'none'">${fields.map(f=>`<option value="${f.id}" data-type="${f.field_type}">${esc(f.name)} (${fieldTypeLabel(f.field_type)})</option>`).join('')}</select></div><div class="field" id="bulkFieldWrap"><label>Значение</label><input name="value" id="bulkFieldInput" placeholder="Введите значение для всех дел"><label class="checkline" style="display:none;margin-top:8px" id="bulkFieldCheck"><input type="checkbox" name="value_bool" value="true"><span>Да (иначе — пусто/нет)</span></label></div><div class="field full"><button class="btn primary">Применить ко всем ${cs.length} делам</button></div></form>`,'case-modal');document.getElementById('bulkFillForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const fieldId=f.get('field_id');const field=fields.find(x=>x.id===fieldId);if(!field)return;let value='';if(field.field_type==='boolean'){value=f.get('value_bool')==='true'?'true':'false'}else{value=String(f.get('value')||'')}try{for(const c of cs){const existing=state.caseFieldValues.find(v=>v.case_id===c.id&&v.field_id===fieldId);if(existing){const {error}=await sb.from('crm_case_field_values').update({value_text:value}).eq('id',existing.id);if(error)throw error}else{const {error}=await sb.from('crm_case_field_values').insert({case_id:c.id,field_id:fieldId,value_text:value,created_by:state.user.id});if(error)throw error}}await reload();closeModal();toast(`Значение применено к ${cs.length} делам`)}catch(err){toast(err.message||'Ошибка при заполнении')}}}async function groupBulkChangeStage(groupId){const cs=state.cases.filter(c=>c.group_id===groupId);const first=cs[0];if(!first){toast('В группе нет дел');return}const pipelineId=first.legal_pipeline_id;const stages=stagesFor(pipelineId);if(!stages.length){toast('У воронки нет стадий');return}modal(`<div class="modal-head"><div><h2>Массовая смена стадии</h2><div class="card-sub">Все ${cs.length} дел группы будут переведены на выбранную стадию.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="bulkStageForm" style="margin-top:16px;display:grid;gap:10px"><div class="field"><label>Стадия</label><select name="stage_id">${stages.map(s=>`<option value="${s.id}" ${s.id===first.legal_stage_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field full"><button class="btn primary">Перевести ${cs.length} дел</button></div></form>`,'case-modal');document.getElementById('bulkStageForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const stageId=f.get('stage_id');if(!stageId)return;try{const ids=cs.map(c=>c.id);const {error}=await sb.from('crm_cases').update({legal_stage_id:stageId,updated_at:new Date().toISOString()}).in('id',ids);if(error)throw error;await reload();closeModal();toast(`Стадия изменена у ${cs.length} дел`)}catch(err){toast(err.message||'Ошибка при смене стадии')}}}async function groupBulkCreateCases(groupId){const g=state.groups.find(x=>x.id===groupId);const cs=state.cases.filter(c=>c.group_id===groupId);const first=cs[0];const pipelineId=first?.legal_pipeline_id||state.pipelines.find(p=>p.entity_type==='case')?.id;const stages=stagesFor(pipelineId);const org=state.orgs.find(o=>o.id===cs[0]?.organization_id);modal(`<div class="modal-head"><div><h2>Массовое создание дел</h2><div class="card-sub">Каждая строка — отдельное дело. Создаются в группе «${esc(g?.name||'')}»${org?`, организация «${esc(org.name)}»`:''}.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="bulkCreateForm" style="margin-top:16px;display:grid;gap:10px"><div class="field"><label>Стадия</label><select name="stage_id">${stages.map(s=>`<option value="${s.id}" ${s.id===first?.legal_stage_id?'selected':''}>${esc(s.name)}</option>`).join('')||'<option value="">Нет стадий</option>'}</select></div><div class="field full"><label>Названия дел (по одному на строку)</label><textarea class="bulk-textarea" name="titles" placeholder="Иванов И.И. — взыскание алиментов&#10;Петров П.П. — расторжение договора&#10;Сидоров С.С. — банкротство" required></textarea></div><div class="field full"><button class="btn primary" ${stages.length?'':'disabled'}>Создать</button></div></form>`,'case-modal');document.getElementById('bulkCreateForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const stageId=f.get('stage_id');const titles=String(f.get('titles')||'').split('\n').map(t=>t.trim()).filter(Boolean);if(!titles.length){toast('Введите хотя бы одно название');return}try{let created=0;for(const title of titles){const {data,error}=await sb.from('crm_cases').insert({title,legal_pipeline_id:pipelineId,legal_stage_id:stageId,organization_id:org?.id||null,group_id:groupId,owner_id:state.user.id}).select('*').single();if(error)throw error;created++;if(created%5===0)toast(`Создано ${created} из ${titles.length}...`)}await reload();closeModal();toast(`Создано ${titles.length} дел`)}catch(err){toast(err.message||'Ошибка при создании дел')}}}

async function newLegalPipeline(){const name=prompt('Название юридической воронки');if(!name?.trim())return;const {data,error}=await sb.from('crm_pipelines').insert({name:name.trim(),entity_type:'case',is_system:false,sort_order:state.pipelines.length,created_by:state.user.id}).select().single();if(error)toast(error.message);else{state.legalPipelineView=data.id;await reload();toast('Воронка создана')}}

async function deletePipeline(id){const p=state.pipelines.find(x=>x.id===id);if(!p)return;if(p.is_system){toast('Системную воронку удалить нельзя');return}if(!confirm(`Удалить воронку «${p.name}»? Дела не удаляются.`))return;if(state.cases.some(c=>c.legal_pipeline_id===id)){toast('В воронке есть дела. Сначала перенесите их в другую воронку.');return}const {error}=await sb.from('crm_pipelines').update({active:false}).eq('id',id);if(error)toast(error.message);else{state.legalPipelineView='all';await reload()}}
async function newStage(pid){const name=prompt('Название новой колонки');if(!name?.trim())return;const max=Math.max(-1,...stagesFor(pid).map(s=>s.sort_order));const {error}=await sb.from('crm_pipeline_stages').insert({pipeline_id:pid,name:name.trim(),sort_order:max+1});if(error)toast(error.message);else await reload()}
async function renameStage(id){const s=state.stages.find(x=>x.id===id),name=prompt('Новое название колонки',s?.name);if(!name?.trim())return;const {error}=await sb.from('crm_pipeline_stages').update({name:name.trim()}).eq('id',id);if(error)toast(error.message);else await reload()}
async function deleteStage(id){const s=state.stages.find(x=>x.id===id);if(!s)return;const used=state.cases.filter(c=>c.legal_stage_id===id);if(used.length){const targets=stagesFor(s.pipeline_id).filter(x=>x.id!==id);if(!targets.length){toast('Нельзя удалить единственную колонку с делами');return}const options=targets.map((x,i)=>`${i+1}. ${x.name}`).join('\n');const pick=prompt(`В колонке есть ${used.length} дел. Куда их перенести?\n${options}\nВведите номер`),target=targets[Number(pick)-1];if(!target)return;const {error:moveError}=await sb.from('crm_cases').update({legal_stage_id:target.id,updated_at:new Date().toISOString()}).eq('legal_stage_id',id);if(moveError){toast(moveError.message);return}}const {error}=await sb.from('crm_pipeline_stages').update({active:false}).eq('id',id);if(error)toast(error.message);else await reload()}
function newTask(date=todayKey(),orgId='',caseId=''){const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===orgId?'selected':''}>${esc(o.name)}</option>`).join('');const caseOptions=state.cases.map(c=>`<option value="${c.id}" ${c.id===caseId?'selected':''}>${esc(c.title)}</option>`).join('');modal(`<div class="modal-head"><h2>Новая задача</h2><button class="close" onclick="closeModal()">×</button></div><form id="taskForm" class="grid" style="margin-top:16px"><div class="field full"><label>Задача</label><input name="title" required></div><div class="field"><label>Дата</label><input name="due_date" type="date" value="${esc(date||todayKey())}"></div><div class="field"><label>Время</label><input name="due_time" type="time"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Дело</label><select name="case_id"><option value="">Не указано</option>${caseOptions}</select></div><div class="field full"><label>Заметка</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary">Создать</button></div></form>`);document.getElementById('taskForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_tasks').insert({title:f.get('title'),due_date:f.get('due_date')||null,due_time:f.get('due_time')||null,organization_id:f.get('organization_id')||null,case_id:f.get('case_id')||null,notes:f.get('notes')||null,owner_id:state.user.id});if(error)toast(error.message);else{closeModal();await reload();toast('Задача создана')}}}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===t.organization_id?'selected':''}>${esc(o.name)}</option>`).join('');const caseOptions=state.cases.map(c=>`<option value="${c.id}" ${c.id===t.case_id?'selected':''}>${esc(c.title)}</option>`).join('');modal(`<div class="modal-head"><h2>Редактировать задачу</h2><button class="close" onclick="closeModal()">×</button></div><form id="editTaskForm" class="grid" style="margin-top:16px"><div class="field full"><label>Задача</label><input name="title" value="${esc(t.title)}" required></div><div class="field"><label>Дата</label><input name="due_date" type="date" value="${esc(t.due_date||'')}"></div><div class="field"><label>Время</label><input name="due_time" type="time" value="${esc(t.due_time||'')}"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Дело</label><select name="case_id"><option value="">Не указано</option>${caseOptions}</select></div><div class="field full"><label>Заметка</label><textarea name="notes">${esc(t.notes||'')}</textarea></div><div class="field full"><button class="btn primary">Сохранить</button></div></form>`);document.getElementById('editTaskForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_tasks').update({title:f.get('title'),due_date:f.get('due_date')||null,due_time:f.get('due_time')||null,organization_id:f.get('organization_id')||null,case_id:f.get('case_id')||null,notes:f.get('notes')||null,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{closeModal();await reload();toast('Сохранено')}}}
async function toggleTask(id,done){const {error}=await sb.from('crm_tasks').update({completed:done,completed_at:done?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return}await reload()}
async function startApp(){if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ok=await ensureMember();if(!ok){toast('Нет доступа к CRM');await sb.auth.signOut();showLogin();return}const {data:{session}}=await sb.auth.getSession();state.user=session?.user||state.user;if(!state.user){showLogin();return}await reload()}
async function boot(){state.theme=localStorage.getItem('pravodom_theme')||'system';state.uiMode=(()=>{let m=localStorage.getItem('pravodom_ui_mode')||'classic';if(m==='full'||m==='simple')m='classic';return m})();applyTheme();applyUiMode();sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:{session}}=await sb.auth.getSession();if(session){try{const ok=await ensureMember();if(!ok){toast('Нет доступа к CRM');await sb.auth.signOut();showLogin();return}state.user=session.user;await reload()}catch(e){console.error(e);showFatal(e)}}else showLogin();sb.channel('pravodom-live').on('postgres_changes',{event:'*',schema:'public',table:'crm_pipelines'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_pipeline_stages'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_organizations'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_cases'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_case_groups'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_tasks'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_case_fields'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_case_field_values'},()=>reload()).subscribe();sb.auth.onAuthStateChange(async(_e,s)=>{if(s?.user&&!state.user){state.user=s.user;try{if(await ensureMember())await reload()}catch(e){showFatal(e)}}else if(!s){state.user=null;showLogin()}})}
document.addEventListener('click',e=>{if(!e.target.closest('.soft-select'))document.querySelectorAll('.soft-select.open').forEach(x=>x.classList.remove('open'))});
boot();
</script>
