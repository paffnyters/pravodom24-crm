function tasksHtml(type,id){const tasks=state.tasks.filter(t=>type==='org'?t.organization_id===id:t.case_id===id);if(!tasks.length)return '<div class="card-sub">Задач пока нет.</div>';const today=todayKey();const active=tasks.filter(t=>!t.completed&&(!t.due_date||t.due_date>=today));const overdue=tasks.filter(t=>!t.completed&&t.due_date&&t.due_date<today);const done=tasks.filter(t=>t.completed);const sortByDate=(a,b)=>{const da=(a.due_date||'9999')+a.due_time||'';const db=(b.due_date||'9999')+b.due_time||'';return String(da).localeCompare(String(db))};const renderItem=t=>{const isOverdue=!t.completed&&t.due_date&&t.due_date<today;return `<div class="task-row ${t.completed?'done':''} ${isOverdue?'task-overdue':''}"><div class="task-row-info"><div class="task-row-title">${t.completed?'✓ ':''}${esc(t.title)}</div><div class="task-row-meta">${t.due_date?fmtDate(t.due_date):'Без даты'}${t.due_time?' · '+esc(t.due_time.slice(0,5)):''}${t.completed?' · выполнено':''}${isOverdue?' · ПРОСРОЧЕНО':''}</div>${t.notes?`<div class="task-row-notes">${esc(t.notes)}</div>`:''}</div><button class="btn small" onclick="editTask('${t.id}')">Изменить</button></div>`};let html='';if(overdue.length)html+=`<div class="task-group"><div class="task-group-title task-overdue-title">Просрочено (${overdue.length})</div>${overdue.sort(sortByDate).map(renderItem).join('')}</div>`;if(active.length)html+=`<div class="task-group"><div class="task-group-title">Активные (${active.length})</div>${active.sort(sortByDate).map(renderItem).join('')}</div>`;if(done.length)html+=`<div class="task-group"><div class="task-group-title task-done-title">Выполнено (${done.length})</div>${done.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).map(renderItem).join('')}</div>`;return html}
function openOrg(id){const o=state.orgs.find(x=>x.id===id);if(!o)return;const stages=stagesFor(o.sales_pipeline_id),orgCases=state.cases.filter(c=>c.organization_id===id&&!c.deleted_at);const stageBar=stages.length?`<div class="case-stage-bar"><div class="stage-switcher">${stages.map((s,i)=>{const color=STAGE_COLORS[i%STAGE_COLORS.length];const active=s.id===o.sales_stage_id;return `<button class="stage-pill${active?' active':''}" style="--pill-color:${color}" onclick="quickChangeOrgStage('${id}','${s.id}')" title="Сменить стадию на «${esc(s.name)}»">${esc(s.name)}</button>`}).join('')}</div></div>`:'';const headerActions=`<div class="case-head-actions"><button class="btn small" onclick="orgBulkCreateCases('${id}')" title="Создать несколько дел">+ Создать дела</button><button class="btn small" onclick="newTask('${todayKey()}','${id}')" title="Поставить задачу">+ Задача</button><button class="btn small" onclick="editOrg('${id}')" title="Редактировать">Редактировать</button><button class="close" onclick="closeModal()">×</button></div>`;const deleteRow=`<div class="delete-row"><button class="btn danger small" onclick="deleteOrg('${id}')">Удалить карточку</button></div>`;modal(`<div class="modal-head case-head"><div class="case-head-info"><h2>${esc(o.name)}</h2><div class="card-sub">${o.contact_name?esc(o.contact_name):'Контакт не указан'}</div></div>${headerActions}</div>${stageBar}<div class="detail-layout modal-card-layout" id="caseLayout" style="margin-top:6px"><div class="detail-main"><div class="section" style="margin-top:0;padding-top:0;border-top:0"><h3>Источник</h3>${sourceReadOnly(o.source||'not_set')}</div><div class="section"><h3>Стоимость услуг</h3><div class="card-view-value ${o.service_cost_unknown!==false?'muted':''}">${o.service_cost_unknown!==false?'?':fmtMoney(o.service_cost)}</div></div>${o.phone||o.email||o.inn||o.telegram||o.website||o.address?`<div class="section"><h3>Контакты</h3><div class="list">${o.phone?orgFieldView('Телефон',o.phone):''}${o.email?orgFieldView('Email',o.email):''}${o.telegram?orgFieldView('Telegram',o.telegram):''}${o.website?orgFieldView('Сайт',o.website):''}${o.inn?orgFieldView('ИНН',o.inn):''}${o.address?orgFieldView('Адрес',o.address):''}</div></div>`:''}${o.position?`<div class="section">${orgFieldView('Должность',o.position)}</div>`:''}${o.max_contact?`<div class="section">${orgFieldView('Дополнительный контакт',o.max_contact)}</div>`:''}${orgCases.length?`<div class="section"><h3>Дела (${orgCases.length})</h3><div class="multi">${orgCases.map(c=>`<button class="btn small" onclick="openCase('${c.id}')">${esc(c.title)}</button>`).join('')}</div></div>`:''}${o.notes?`<div class="section">${orgFieldView('Заметка',o.notes)}</div>`:''}<div class="section"><div class="tasks-box-head"><h3>Задачи</h3><button class="btn small" onclick="newTask('${todayKey()}','${id}')">+ Задача</button></div>${tasksHtml('org',id)}</div>${deleteRow}</div><div class="detail-resizer" id="caseResizer" title="Потяните, чтобы изменить ширину"></div><div class="detail-side"><h3 style="margin-top:0">Комментарии</h3>${commentsHtml('org',id)}${documentsHtmlForOrg(id)}</div></div>`,'case-modal');initCaseResizer()}async function quickChangeOrgStage(orgId,stageId){try{const {error}=await sb.from('crm_organizations').update({sales_stage_id:stageId,updated_at:new Date().toISOString()}).eq('id',orgId);if(error)throw error;const o=state.orgs.find(x=>x.id===orgId);if(o){o.sales_stage_id=stageId;o.updated_at=new Date().toISOString()}openOrg(orgId);render();toast('Стадия изменена')}catch(e){console.error(e);toast(e.message||'Не удалось сменить стадию')}}async function orgBulkCreateCases(orgId){const o=state.orgs.find(x=>x.id===orgId);if(!o)return;const casePipelines=state.pipelines.filter(p=>p.entity_type==='case');const p=casePipelines[0];const stages=stagesFor(p?.id);modal(`<div class="modal-head"><div><h2>Создать дела для «${esc(o.name)}»</h2><div class="card-sub">Каждая строка — отдельное дело. Все будут привязаны к этому клиенту.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="orgBulkForm" style="margin-top:16px;display:grid;gap:10px">${p?`<div class="field"><label>Юридическая воронка</label><select name="pipeline_id">${casePipelines.map(pp=>`<option value="${pp.id}" ${pp.id===p.id?'selected':''}>${esc(pp.name)}</option>`).join('')}</select></div><div class="field"><label>Стадия</label><select name="stage_id">${stages.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>`:'<div class="card-sub">Сначала создайте юридическую воронку.</div>'}<div class="field full"><label>Названия дел (по одному на строку)</label><textarea class="bulk-textarea" name="titles" placeholder="Иванов И.И. — взыскание алиментов&#10;Петров П.П. — расторжение договора" required></textarea></div><div class="field full"><button class="btn primary" ${p?'':'disabled'}>Создать дела</button></div></form>`,'case-modal');document.getElementById('orgBulkForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const pipelineId=f.get('pipeline_id');const stageId=f.get('stage_id');const titles=String(f.get('titles')||'').split('\n').map(t=>t.trim()).filter(Boolean);if(!titles.length){toast('Введите хотя бы одно название');return}try{let created=0;for(const title of titles){const {error}=await sb.from('crm_cases').insert({title,legal_pipeline_id:pipelineId,legal_stage_id:stageId,organization_id:orgId,owner_id:state.user.id});if(error)throw error;created++;if(created%5===0)toast(`Создано ${created} из ${titles.length}...`)}await reload();closeModal();toast(`Создано ${titles.length} дел для «${o.name}»`)}catch(err){toast(err.message||'Ошибка при создании дел')}}}
function diskCasePath(c){const org=state.orgs.find(o=>o.id===c.organization_id);const safe=v=>String(v||'Без названия').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,140)||'Без названия';const same=state.cases.filter(x=>x.id!==c.id&&x.organization_id===c.organization_id&&x.title===c.title);const folder=safe(c.title)+(same.length?` [${c.id.slice(0,8)}]`:'');return `CRM Праводом.рф/${safe(org?.name||'Без организации')}/${folder}/документы`}
function fmtBytes(n){if(!n&&n!==0)return '';const u=['Б','КБ','МБ','ГБ'];let x=Number(n),i=0;while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x.toFixed(i?1:0)} ${u[i]}`}
function diskOrgPath(o){const safe=v=>String(v||'Без названия').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,140)||'Без названия';return `CRM Праводом.рф/${safe(o.name)}/документы`}
function documentsHtmlForOrg(orgId){const rows=state.orgFiles.filter(f=>f.organization_id===orgId);return `<div class="documents-box"><div class="modal-head" style="align-items:center"><div><h3 style="margin:0">Документы</h3><div class="card-sub">Файлы хранятся на Яндекс Диске в папке клиента.</div></div><div class="actions"><label class="btn small upload-label">+ Добавить файл<input type="file" multiple hidden onchange="uploadOrgFiles('${orgId}',this.files);this.value='' "></label></div></div><div class="document-list">${rows.map(f=>{const m=(f.mime_type||'').toLowerCase();const canPreview=m==='application/pdf'||m.startsWith('image/')||m.startsWith('text/')||isWordDocx(m,f.name)||isExcelMime(m,f.name);return `<div class="document-row"><div class="document-main"><div class="document-name" title="${esc(f.name)}">${esc(f.name)}</div><div class="document-meta">${fmtBytes(f.size)}</div></div><div class="document-actions">${canPreview?`<button class="btn" onclick="openOrgFile('${f.id}')">Открыть</button>`:''}<button class="btn" onclick="downloadOrgFile('${f.id}')">Скачать</button><button class="btn danger" onclick="deleteOrgFile('${f.id}')">Удалить</button></div></div>`}).join('')||'<div class="empty">Документов пока нет.</div>'}</div></div>`}
async function uploadOrgFiles(orgId,fileList){const o=state.orgs.find(x=>x.id===orgId);if(!o||!fileList?.length)return;const files=[...fileList];let cancelled=false;const cancelBtn=document.createElement('button');cancelBtn.className='upload-progress-cancel';cancelBtn.textContent='×';cancelBtn.onclick=()=>{cancelled=true;toast('Загрузка отменена')};try{await ensureOrgDiskFolder(o);showUploadProgress(files.length,cancelBtn);for(let i=0;i<files.length;i++){if(cancelled)throw new Error('Загрузка отменена пользователем');const file=files[i];if(!file.size)throw new Error(`Файл «${file.name}» имеет размер 0 байт.`);updateUploadProgress(i+1,files.length,file.name,0);const cleanName=file.name.replace(/[\/:*?"<>|]+/g,' ').trim()||'Файл';const path=`${diskOrgPath(o)}/${cleanName}`;const hrefData=await yandexAction({action:'upload_href',path});if(!hrefData?.href)throw new Error('Яндекс Диск не выдал адрес загрузки.');await uploadFileWithProgress(hrefData.href,file,(p)=>updateUploadProgress(i+1,files.length,file.name,p));const verify=await yandexAction({action:'verify',path,mime_type:file.type||'application/octet-stream'});const actualSize=Number(verify?.size||0);if(actualSize!==file.size)throw new Error(`Файл «${file.name}» загружен некорректно: отправлено ${file.size} байт, на Яндексе ${actualSize} байт.`);const resourceId=verify?.resource_id||null;const storedMime=verify?.mime_type||file.type||null;const {data:inserted,error:dbError}=await sb.from('crm_case_files').insert({organization_id:orgId,name:file.name,yandex_path:path,yandex_resource_id:resourceId,mime_type:storedMime,size:actualSize,created_by:state.user.id}).select('*').single();if(dbError)throw new Error('Файл загружен на Яндекс Диск, но запись в CRM не создана: '+dbError.message);state.orgFiles=[inserted,...state.orgFiles.filter(x=>x.id!==inserted.id)]}hideUploadProgress();openOrg(orgId);toast('Файлы загружены в карточку клиента')}catch(e){hideUploadProgress();console.error(e);toast(e.message||'Не удалось загрузить файл')}}
async function ensureOrgDiskFolder(o){return yandexAction({action:'prepare_case',path:diskOrgPath(o)})}
async function fetchOrgFileBlob(f,download){const {data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw new Error('Сессия CRM истекла. Войдите заново.');const res=await fetch(`${SUPABASE_URL}/functions/v1/yandex-disk`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'proxy',path:f.yandex_path,name:f.name,mime_type:f.mime_type||'application/octet-stream',download:download})});if(!res.ok){let detail='';try{detail=await res.text()}catch{}throw new Error(detail||`Ошибка получения файла (${res.status})`)}const blob=await res.blob();if(!blob.size)throw new Error('CRM получила пустой файл от Яндекс Диска.');return blob}
async function downloadOrgFile(fileId){const f=state.orgFiles.find(x=>x.id===fileId);if(!f)return;try{toast('Готовим файл...');const blob=await fetchOrgFileBlob(f,true);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),180000)}catch(e){console.error(e);toast(e.message||'Не удалось скачать файл')}}
async function openOrgFile(fileId){return previewOrgFile(fileId)}
async function previewOrgFile(fileId){const f=state.orgFiles.find(x=>x.id===fileId);if(!f)return;openPreviewModal(f);try{const blob=await fetchOrgFileBlob(f,false);await renderPreviewContent(f,blob)}catch(e){console.error(e);renderPreviewError(f,e)}}
async function renameOrgFile(fileId){const f=state.orgFiles.find(x=>x.id===fileId);if(!f)return;const next=prompt('Новое имя файла',f.name);if(next===null)return;const name=next.replace(/[\\/:*?"<>|]+/g,' ').trim();if(!name||name===f.name)return;const base=f.yandex_path.slice(0,f.yandex_path.lastIndexOf('/')+1),newPath=base+name;try{await yandexAction({action:'rename',path:f.yandex_path,new_path:newPath});const {data,error}=await sb.from('crm_case_files').update({name,yandex_path:newPath}).eq('id',fileId).select('*').single();if(error)throw error;if(data)state.orgFiles=state.orgFiles.map(x=>x.id===fileId?data:x);openOrg(f.organization_id);toast('Файл переименован')}catch(e){toast(e.message||'Не удалось переименовать файл')}}
async function deleteOrgFile(fileId){const f=state.orgFiles.find(x=>x.id===fileId);if(!f)return;if(!confirm(`Удалить файл «${f.name}»?`))return;try{await yandexAction({action:'delete',path:f.yandex_path});const {error}=await sb.from('crm_case_files').delete().eq('id',fileId);if(error)throw error;state.orgFiles=state.orgFiles.filter(x=>x.id!==fileId);openOrg(f.organization_id);toast('Файл удалён')}catch(e){toast(e.message||'Не удалось удалить файл')}}

function documentsHtml(caseId){const rows=state.caseFiles.filter(f=>f.case_id===caseId);return `<div class="documents-box"><div class="modal-head" style="align-items:center"><div><h3 style="margin:0">Документы</h3><div class="card-sub">Файлы хранятся на Яндекс Диске в папке дела.</div></div><div class="actions"><label class="btn small upload-label">+ Добавить файл<input type="file" multiple hidden onchange="uploadCaseFiles('${caseId}',this.files);this.value='' "></label></div></div><div class="document-list">${rows.map(f=>{const m=(f.mime_type||'').toLowerCase();const canPreview=m==='application/pdf'||m.startsWith('image/')||m.startsWith('text/')||isWordDocx(m,f.name)||isExcelMime(m,f.name);return `<div class="document-row"><div class="document-main"><div class="document-name" title="${esc(f.name)}">${esc(f.name)}</div><div class="document-meta">${fmtBytes(f.size)}</div></div><div class="document-actions">${canPreview?`<button class="btn" onclick="openCaseFile('${f.id}')">Открыть</button>`:''}<button class="btn" onclick="downloadCaseFile('${f.id}')">Скачать</button><button class="btn danger" onclick="deleteCaseFile('${f.id}')">Удалить</button></div></div>`}).join('')||'<div class="empty">Документов пока нет.</div>'}</div></div>`}
async function refreshCaseFiles(caseId){const {data,error}=await sb.from('crm_case_files').select('*').eq('case_id',caseId).order('created_at',{ascending:false});if(error){toast('Не удалось обновить документы: '+error.message);return}state.caseFiles=state.caseFiles.filter(f=>f.case_id!==caseId).concat(data||[]);openCase(caseId)}
async function yandexAction(body){const {data,error}=await sb.functions.invoke('yandex-disk',{body});if(error){let detail='';try{const ctx=error.context;if(ctx?.clone){const r=await ctx.clone();detail=await r.text()}else if(ctx?.text)detail=await ctx.text()}catch{}throw new Error(detail||error.message||'Ошибка Edge Function')}if(!data?.ok)throw new Error(typeof data?.error==='string'?data.error:JSON.stringify(data?.error||data));return data}
async function ensureCaseDiskFolder(c){return yandexAction({action:'prepare_case',path:diskCasePath(c)})}
async function uploadCaseFiles(caseId,fileList){const c=state.cases.find(x=>x.id===caseId);if(!c||!fileList?.length)return;const files=[...fileList];let cancelled=false;const cancelBtn=document.createElement('button');cancelBtn.className='upload-progress-cancel';cancelBtn.textContent='×';cancelBtn.onclick=()=>{cancelled=true;toast('Загрузка отменена')};try{await ensureCaseDiskFolder(c);showUploadProgress(files.length,cancelBtn);for(let i=0;i<files.length;i++){if(cancelled)throw new Error('Загрузка отменена пользователем');const file=files[i];if(!file.size)throw new Error(`Файл «${file.name}» имеет размер 0 байт.`);updateUploadProgress(i+1,files.length,file.name,0);const cleanName=file.name.replace(/[\/:*?"<>|]+/g,' ').trim()||'Файл';const path=`${diskCasePath(c)}/${cleanName}`;const hrefData=await yandexAction({action:'upload_href',path});if(!hrefData?.href)throw new Error('Яндекс Диск не выдал адрес загрузки.');await uploadFileWithProgress(hrefData.href,file,(p)=>updateUploadProgress(i+1,files.length,file.name,p));const verify=await yandexAction({action:'verify',path,mime_type:file.type||'application/octet-stream'});const actualSize=Number(verify?.size||0);if(actualSize!==file.size)throw new Error(`Файл «${file.name}» загружен некорректно: отправлено ${file.size} байт, на Яндексе ${actualSize} байт.`);const resourceId=verify?.resource_id||null;const storedMime=verify?.mime_type||file.type||null;const {data:inserted,error:dbError}=await sb.from('crm_case_files').insert({case_id:caseId,name:file.name,yandex_path:path,yandex_resource_id:resourceId,mime_type:storedMime,size:actualSize,created_by:state.user.id}).select('*').single();if(dbError)throw new Error('Файл загружен на Яндекс Диск, но запись в CRM не создана: '+dbError.message);state.caseFiles=[inserted,...state.caseFiles.filter(x=>x.id!==inserted.id)]}hideUploadProgress();openCase(caseId);toast('Файлы загружены в CRM')}catch(e){hideUploadProgress();console.error(e);toast(e.message||'Не удалось загрузить файл')}}function uploadFileWithProgress(url,file,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',url,true);xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');xhr.upload.onprogress=(e)=>{if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total)};xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)resolve();else reject(new Error(`Ошибка загрузки на Яндекс Диск (${xhr.status}): ${xhr.responseText||'нет тела'}`))};xhr.onerror=()=>reject(new Error('Сетевая ошибка при загрузке на Яндекс Диск. Возможные причины: CORS на стороне Яндекса, нет интернета, VPN блокирует uploader.disk.yandex.net.'));xhr.ontimeout=()=>reject(new Error('Таймаут при загрузке файла на Яндекс Диск.'));xhr.timeout=1800000;xhr.send(file)})}function showUploadProgress(total,cancelBtn){let p=document.getElementById('uploadProgressBox');if(!p){p=document.createElement('div');p.id='uploadProgressBox';p.className='upload-progress';document.body.appendChild(p)}p.innerHTML=`<div class="upload-progress-title">Загрузка файлов</div><div class="upload-progress-name" id="upName">Подготовка...</div><div class="upload-progress-bar"><div class="upload-progress-bar-fill" id="upFill"></div></div><div class="upload-progress-stat" id="upStat">${total} файл(ов)</div>`;p.appendChild(cancelBtn)}function updateUploadProgress(idx,total,name,frac){const fill=document.getElementById('upFill');const stat=document.getElementById('upStat');const nm=document.getElementById('upName');if(nm)nm.textContent=`${idx}/${total}: ${name}`;if(fill)fill.style.width=Math.round(frac*100)+'%';if(stat)stat.textContent=Math.round(frac*100)+'%'}function hideUploadProgress(){const p=document.getElementById('uploadProgressBox');if(p)p.remove()}

f.get('debtor_name')||null,debtor_identifier:f.get('debtor_identifier')||null,legal_stage_id:stage,source,organization_id:f.get('organization_id')||null,profit:f.get('profit')===''?null:Number(f.get('profit')),notes:f.get('notes')||null,updated_at:new Date().toISOString()};const {error}=await sb.from('crm_cases').update(payload).eq('id',id);if(error)throw error;await saveCaseCustomFields(id,c.legal_pipeline_id,e.target);await reload();openCase(id);toast('Изменения сохранены')}catch(err){toast(err.message||'Не удалось сохранить')}}}
function openGroup(id){const g=state.groups.find(x=>x.id===id),cs=state.cases.filter(c=>c.group_id===id);const pipelineId=cs[0]?.legal_pipeline_id||state.pipelines.find(p=>p.entity_type==='case')?.id;const pipeline=state.pipelines.find(p=>p.id===pipelineId);const stages=stagesFor(pipelineId);const fields=state.caseFields.filter(f=>f.pipeline_id===pipelineId);modal(`<div class="modal-head"><div><h2>${esc(g?.name||'Группа')}</h2><div class="card-sub">${cs.length} самостоятельных дел · одна организация</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section" style="margin-top:16px"><div class="bulk-actions"><button class="btn small" onclick="groupBulkFillFields('${id}')" title="Заполнить одинаковое значение в выбранное поле для всех дел группы">📝 Заполнить поле</button><button class="btn small" onclick="groupBulkChangeStage('${id}')" title="Перевести все дела группы на выбранную стадию">↻ Сменить стадию</button><button class="btn small" onclick="groupBulkCreateCases('${id}')" title="Создать сразу несколько дел в эту группу">+ Создать дела</button></div></div><div class="actions" style="margin-bottom:10px"><button class="btn small" onclick="closeModal();startGroupSelection('${pipelineId}','${id}')">+ Добавить дела</button></div><div class="section"><h3>Дела группы</h3><div class="list">${cs.map(c=>{const stage=stages.find(s=>s.id===c.legal_stage_id);return `<div class="row"><div><strong>${esc(c.title)}</strong><div class="card-sub">${c.debtor_name?esc(c.debtor_name):''}${stage?' · '+esc(stage.name):''}</div></div><button class="btn small" onclick="openCase('${c.id}')">Открыть</button><button class="btn small danger" onclick="removeFromGroup('${c.id}')" title="Убрать дело из группы">Из группы</button></div>`}).join('')||'<div class="empty">Пока нет карточек.</div>'}</div></div>`, 'case-modal')}async function groupBulkFillFields(groupId){const cs=state.cases.filter(c=>c.group_id===groupId);const first=cs[0];if(!first){toast('В группе нет дел');return}const pipelineId=first.legal_pipeline_id;const customFields=state.caseFields.filter(f=>f.pipeline_id===pipelineId);const builtinFields=[{id:'__debtor_name',label:'Должник',type:'text'},{id:'__debtor_identifier',label:'Идентификатор',type:'text'},{id:'__notes',label:'Заметка',type:'multiline'},{id:'__profit',label:'Прибыль',type:'money'},{id:'__comment',label:'Добавить комментарий всем (текст комментария)',type:'multiline'}];const allFields=[...builtinFields,...customFields];if(!allFields.length){toast('Нет доступных полей для заполнения.');return}modal(`<div class="modal-head"><div><h2>Массовое заполнение</h2><div class="card-sub">Выберите поле и введите значение — оно применится ко всем ${cs.length} делам группы.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="bulkFillForm" style="margin-top:16px;display:grid;gap:10px"><div class="field"><label>Поле</label><select name="field_id" id="bulkFieldSel">${allFields.map(f=>`<option value="${f.id}" data-type="${f.type}">${esc(f.label)}${f.id.startsWith('__')?' (базовое поле)':' (параметр карточки)'}</option>`).join('')}</select></div><div class="field" id="bulkFieldWrap"><label>Значение</label><textarea name="value" id="bulkFieldInput" class="bulk-textarea" style="min-height:90px" placeholder="Введите значение для всех дел группы"></textarea></div><div class="field full"><button class="btn primary">Применить ко всем ${cs.length} делам</button></div></form>`,'case-modal');document.getElementById('bulkFillForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const fieldId=f.get('field_id');const value=String(f.get('value')||'').trim();if(!value){toast('Введите значение');return}const isBuiltin=fieldId.startsWith('__');try{if(fieldId==='__comment'){for(const c of cs){const {error}=await sb.from('crm_activities').insert({case_id:c.id,kind:'comment',text:value,created_by:state.user.id});if(error)throw error}}else if(isBuiltin){const col=fieldId.replace('__', ,updated_at:new Date().toISOString()}).in('id',ids);if(error)throw error;await reload();closeModal();toast(`Стадия изменена у ${cs.length} дел`)}catch(err){toast(err.message||'Ошибка при смене стадии')}}}async function groupBulkCreateCases(groupId){const g=state.groups.find(x=>x.id===groupId);const cs=state.cases.filter(c=>c.group_id===groupId);const first=cs[0];const pipelineId=first?.legal_pipeline_id||state.pipelines.find(p=>p.entity_type==='case')?.id;const stages=stagesFor(pipelineId);const org=state.orgs.find(o=>o.id===cs[0]?.organization_id);modal(`<div class="modal-head"><div><h2>Массовое создание дел</h2><div class="card-sub">Каждая строка — отдельное дело. Создаются в группе «${esc(g?.name||'')}»${org?`, организация «${esc(org.name)}»`:''}.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="bulkCreateForm" style="margin-top:16px;display:grid;gap:10px"><div class="field"><label>Стадия</label><select name="stage_id">${stages.map(s=>`<option value="${s.id}" ${s.id===first?.legal_stage_id?'selected':''}>${esc(s.name)}</option>`).join('')||'<option value="">Нет стадий</option>'}</select></div><div class="field full"><label>Названия дел (по одному на строку)</label><textarea class="bulk-textarea" name="titles" placeholder="Иванов И.И. — взыскание алиментов&#10;Петров П.П. — расторжение договора&#10;Сидоров С.С. — банкротство" required></textarea></div><div class="field full"><button class="btn primary" ${stages.length?'':'disabled'}>Создать</button></div></form>`,'case-modal');document.getElementById('bulkCreateForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const stageId=f.get('stage_id');const titles=String(f.get('titles')||'').split('\n').map(t=>t.trim()).filter(Boolean);if(!titles.length){toast('Введите хотя бы одно название');return}try{let created=0;for(const title of titles){const {data,error}=await sb.from('crm_cases').insert({title,legal_pipeline_id:pipelineId,legal_stage_id:stageId,organization_id:org?.id||null,group_id:groupId,owner_id:state.user.id}).select('*').single();if(error)throw error;created++;if(created%5===0)toast(`Создано ${created} из ${titles.length}...`)}await reload();closeModal();toast(`Создано ${titles.length} дел`)}catch(err){toast(err.message||'Ошибка при создании дел')}}}

async function newLegalPipeline(){const name=prompt('Название юридической воронки');if(!name?.trim())return;const {data,error}=await sb.from('crm_pipelines').insert({name:name.trim(),entity_type:'case',is_system:false,sort_order:state.pipelines.length,created_by:state.user.id}).select().single();if(error)toast(error.message);else{state.legalPipelineView=data.id;await reload();toast('Воронка создана')}}

async function renameStage(id){const s=state.stages.find(x=>x.id===id),name=prompt('Новое название колонки',s?.name);if(!name?.trim())return;const {error}=await sb.from('crm_pipeline_stages').update({name:name.trim()}).eq('id',id);if(error)toast(error.message);else await reload()}

function newTask(date=todayKey(),orgId='',caseId=''){const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===orgId?'selected':''}>${esc(o.name)}</option>`).join('');const caseOptions=state.cases.map(c=>`<option value="${c.id}" ${c.id===caseId?'selected':''}>${esc(c.title)}</option>`).join('');modal(`<div class="modal-head"><h2>Новая задача</h2><button class="close" onclick="closeModal()">×</button></div><form id="taskForm" class="grid" style="margin-top:16px"><div class="field full"><label>Задача</label><input name="title" required></div><div class="field"><label>Дата</label><input name="due_date" type="date" value="${esc(date||todayKey())}"></div><div class="field"><label>Время</label><input name="due_time" type="time"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Дело</label><select name="case_id"><option value="">Не указано</option>${caseOptions}</select></div><div class="field full"><label>Заметка</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary">Создать</button></div></form>`);document.getElementById('taskForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_tasks').insert({title:f.get('title'),due_date:f.get('due_date')||null,due_time:f.get('due_time')||null,organization_id:f.get('organization_id')||null,case_id:f.get('case_id')||null,notes:f.get('notes')||null,owner_id:state.user.id});if(error)toast(error.message);else{closeModal();await reload();toast('Задача создана')}}}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===t.organization_id?'selected':''}>${esc(o.name)}</option>`).join('');const caseOptions=state.cases.map(c=>`<option value="${c.id}" ${c.id===t.case_id?'selected':''}>${esc(c.title)}</option>`).join('');modal(`<div class="modal-head"><h2>Редактировать задачу</h2><button class="close" onclick="closeModal()">×</button></div><form id="editTaskForm" class="grid" style="margin-top:16px"><div class="field full"><label>Задача</label><input name="title" value="${esc(t.title)}" required></div><div class="field"><label>Дата</label><input name="due_date" type="date" value="${esc(t.due_date||'')}"></div><div class="field"><label>Время</label><input name="due_time" type="time" value="${esc(t.due_time||'')}"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Дело</label><select name="case_id"><option value="">Не указано</option>${caseOptions}</select></div><div class="field full"><label>Заметка</label><textarea name="notes">${esc(t.notes||'')}</textarea></div><div class="field full"><button class="btn primary">Сохранить</button></div></form>`);document.getElementById('editTaskForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_tasks').update({title:f.get('title'),due_date:f.get('due_date')||null,due_time:f.get('due_time')||null,organization_id:f.get('organization_id')||null,case_id:f.get('case_id')||null,notes:f.get('notes')||null,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{closeModal();await reload();toast('Сохранено')}}}

async function startApp(){if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ok=await ensureMember();if(!ok){toast('Нет доступа к CRM');await sb.auth.signOut();showLogin();return}const {data:{session}}=await sb.auth.getSession();state.user=session?.user||state.user;if(!state.user){showLogin();return}await reload()}
async function boot(){state.theme=localStorage.getItem('pravodom_theme')||'system';state.uiMode='compact';state.glass=localStorage.getItem('pravodom_glass')==='1';applyTheme();applyGlass();applyUiMode();sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:{session}}=await sb.auth.getSession();if(session){try{const ok=await ensureMember();if(!ok){toast('Нет доступа к CRM');await sb.auth.signOut();showLogin();return}state.user=session.user;await reload()}catch(e){console.error(e);showFatal(e)}}else showLogin();sb.channel('pravodom-live').on('postgres_changes',{event:'*',schema:'public',table:'crm_pipelines'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_pipeline_stages'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_organizations'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_cases'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_case_groups'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_tasks'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_case_fields'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_case_field_values'},()=>reload()).subscribe();sb.auth.onAuthStateChange(async(_e,s)=>{if(s?.user&&!state.user){state.user=s.user;try{if(await ensureMember())await reload()}catch(e){showFatal(e)}}else if(!s){state.user=null;showLogin()}})}
document.addEventListener('click',e=>{if(!e.target.closest('.soft-select'))document.querySelectorAll('.soft-select.open').forEach(x=>x.classList.remove('open'))});
boot();
</script>
</body>
</html>
