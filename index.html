<script>
const SUPABASE_URL='https://ncuthxvxiwghjgduchhc.supabase.co';
const SUPABASE_KEY='sb_publishable_30uyWrQ06THITcEIVe4WTw_2BeQSGnp';
let sb=null;
const state={view:'today',user:null,pipelines:[],stages:[],orgs:[],cases:[],groups:[],tasks:[],search:'',theme:'system',legalPipelineView:null,taskDate:null,calendarMonth:null};
const SOURCE_LABEL={mailing:'с рассылок',dmitry_base:'база клиентов Дмитрия',not_set:'не установлено'};
const GROUP_COLORS=['#5b8def','#e07a5f','#3aa981','#9b6bd3','#d49a3a','#4f9da6','#d45d9d','#6d8b74','#8b6f47','#6573c3','#b05a75','#4b7f8c'];
let groupColorSaving=false;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),2800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtMoney(v){if(v===null||v===undefined||v==='')return '';return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(v))+' ₽'}
function dateKey(d){return d.toISOString().slice(0,10)}
function localDateKey(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function parseDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}
function fmtDate(s){if(!s)return '';return parseDate(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function todayKey(){return localDateKey()}
function pipelineFor(type){return state.pipelines.filter(p=>p.entity_type===type&&p.active)}
function stagesFor(pid){return state.stages.filter(s=>s.pipeline_id===pid&&s.active).sort((a,b)=>a.sort_order-b.sort_order)}
function ensureMember(){return sb.rpc('is_crm_member').then(({data,error})=>{if(error)throw error;return data===true})}
function applyTheme(){document.body.classList.remove('dark','system');if(state.theme==='dark')document.body.classList.add('dark');else if(state.theme==='system')document.body.classList.add('system');localStorage.setItem('pravodom_theme',state.theme)}
function pendingTasks(){return state.tasks.filter(t=>!t.completed)}
function todayPending(){return pendingTasks().filter(t=>t.due_date===todayKey())}
function overdueTasks(){return pendingTasks().filter(t=>t.due_date&&t.due_date<todayKey())}
function showLogin(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><h1>Праводом.рф</h1><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button class="btn primary">Войти</button></form></div></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)throw error;await startApp()}catch(x){toast(x.message||'Ошибка входа')}}}
function nav(){const hasToday=todayPending().length>0;return `<aside class="sidebar"><div class="logo">Праводом.рф</div><div class="sidebar-nav"><div class="nav"><button class="${state.view==='today'?'active ':''}${hasToday?'today-active':''}" onclick="setView('today')">Сегодня ${hasToday?'<span class="today-dot"></span>':''}</button><button class="${state.view==='sales'?'active':''}" onclick="setView('sales')">Продажи</button><button class="${state.view==='legal'?'active':''}" onclick="setView('legal')">Юридическая работа</button><button class="${state.view==='clients'?'active':''}" onclick="setView('clients')">Клиенты</button><button class="${state.view==='tasks'?'active':''}" onclick="setView('tasks')">Задачи</button></div></div><div class="sidebar-bottom"><button class="btn settings-btn ${state.view==='settings'?'primary':''}" onclick="setView('settings')">Настройки</button><div class="user">${esc(state.user?.email||'')}</div></div></aside>`}
function bottomNav(){const hasToday=todayPending().length>0;return `<nav class="bottomnav"><button class="${state.view==='today'?'active ':''}${hasToday?'today-active':''}" onclick="setView('today')">Сегодня${hasToday?' •':''}</button><button class="${state.view==='sales'?'active':''}" onclick="setView('sales')">Продажи</button><button class="${state.view==='legal'?'active':''}" onclick="setView('legal')">Юр. работа</button><button class="${state.view==='tasks'?'active':''}" onclick="setView('tasks')">Задачи</button><button class="${state.view==='settings'?'active':''}" onclick="setView('settings')">Настройки</button></nav>`}
function shell(){document.getElementById('root').innerHTML=`<div class="app">${nav()}<main id="main"></main></div>${bottomNav()}`;render()}
function setView(v){state.view=v;state.search='';shell()}
function header(title,button=''){return `<div class="top"><div><h1>${title}</h1></div><div class="actions">${button}</div></div>`}
function searchBar(){return `<input class="search" placeholder="Поиск" value="${esc(state.search)}" oninput="state.search=this.value;render()">`}
function render(){const main=document.getElementById('main');if(!main)return;if(state.view==='today')renderToday(main);else if(state.view==='sales')renderSales(main);else if(state.view==='legal')renderLegal(main);else if(state.view==='clients')renderClients(main);else if(state.view==='tasks')renderTasks(main);else renderSettings(main)}
function renderToday(main){const overdue=overdueTasks(),today=todayPending();let body=header('Сегодня',`<button class="btn primary" onclick="newTask('${todayKey()}')">+ Задача</button>`);if(today.length===1)body+=`<div class="today-banner">Есть 1 невыполненная задача сегодня</div>`;else if(today.length>1)body+=`<div class="today-banner">Есть ${today.length} невыполненных задач сегодня</div>`;else body+=`<div class="card"><div class="card-title">На сегодня всё спокойно</div><div class="card-sub">Невыполненных задач на сегодня нет.</div></div>`;if(overdue.length)body+=`<div class="section"><h3>Просрочено</h3>${taskListHtml(overdue)}</div>`;if(today.length)body+=`<div class="section"><h3>Сегодня</h3>${taskListHtml(today)}</div>`;main.innerHTML=body}
function renderSales(main){const p=pipelineFor('organization')[0],stages=stagesFor(p?.id);main.innerHTML=header('Продажи',`<button class="btn primary" onclick="newOrg()">Добавить</button>`)+`<div class="toolbar">${searchBar()}</div><div class="board">${stages.map(s=>`<section class="column"><div class="column-head"><span class="column-title">${esc(s.name)}</span><span class="count">${state.orgs.filter(o=>o.sales_stage_id===s.id&&matchOrg(o)).length}</span></div>${state.orgs.filter(o=>o.sales_stage_id===s.id&&matchOrg(o)).map(orgCard).join('')||'<div class="empty">Пусто</div>'}</section>`).join('')||'<div class="empty">Воронка «Продажи» не настроена.</div>'}</div>`}
function matchOrg(o){const q=state.search.toLowerCase();return !q||[o.name,o.contact_name,o.phone,o.email,o.inn].filter(Boolean).some(x=>String(x).toLowerCase().includes(q))}
function orgCostHtml(o){if(o.service_cost_unknown!==false)return '<span class="chip">услуги: ?</span>';if(o.service_cost!==null&&o.service_cost!==undefined&&o.service_cost!=='')return `<span class="chip">услуги: ${fmtMoney(o.service_cost)}</span>`;return ''}
function orgCard(o){return `<article class="card" onclick="openOrg('${o.id}')"><div class="card-title">${esc(o.name)}</div>${o.contact_name?`<div class="card-sub">${esc(o.contact_name)}</div>`:''}<div class="meta"><span class="chip">${esc(SOURCE_LABEL[o.source||'not_set'])}</span>${orgCostHtml(o)}</div>${o.phone?`<div class="card-sub" style="margin-top:9px">${esc(o.phone)}</div>`:''}<button class="btn card-action" onclick="event.stopPropagation();openOrg('${o.id}')">Открыть</button></article>`}
function renderLegal(main){const ps=pipelineFor('case');if(!state.legalPipelineView&&ps[0])state.legalPipelineView=ps[0].id;const selected=state.legalPipelineView==='all'?null:ps.find(p=>p.id===state.legalPipelineView)||ps[0];const tabs=ps.map(p=>`<button class="btn pipeline-tab ${selected?.id===p.id?'active':''}" onclick="selectLegalPipeline('${p.id}')">${esc(p.name)}</button>`).join('');const allTab=`<button class="btn pipeline-tab ${state.legalPipelineView==='all'?'active':''}" onclick="selectLegalPipeline('all')">Все воронки</button>`;main.innerHTML=header('Юридическая работа',`<button class="btn" onclick="newLegalPipeline()">+ Воронка</button><button class="btn primary" onclick="newCase()">+ Дело</button>`)+`<div class="pipeline-switch">${tabs}${allTab}</div>${selected?legalPipelineHtml(selected):ps.map(legalPipelineHtml).join('')}`;if(!ps.length)main.innerHTML+=`<div class="card"><div class="card-title">Юридических воронок пока нет</div><div class="card-sub">Создайте первую воронку под свой процесс.</div><button class="btn primary" style="margin-top:12px" onclick="newLegalPipeline()">Создать первую воронку</button></div>`}
function selectLegalPipeline(id){state.legalPipelineView=id;state.search='';render()}
function legalPipelineHtml(p){const stages=stagesFor(p.id),total=state.cases.filter(c=>c.legal_pipeline_id===p.id).length;return `<section style="margin-bottom:26px"><div class="toolbar"><div><h2 style="margin:0;font-size:18px">${esc(p.name)}</h2><div class="card-sub">${total} дел</div></div><div class="actions"><button class="btn small" onclick="renamePipeline('${p.id}')">Переименовать</button><button class="btn danger small" onclick="deletePipeline('${p.id}')">Удалить</button></div></div>${profitSummary(p.id)}<div class="board">${stages.map(s=>{const cs=state.cases.filter(c=>c.legal_stage_id===s.id&&matchCase(c));return `<section class="column"><div class="column-head"><div><div class="column-title">${esc(s.name)}</div><div class="actions" style="margin-top:6px"><button class="btn small" onclick="renameStage('${s.id}')">Изменить</button><button class="btn danger small" onclick="deleteStage('${s.id}')">Удалить</button></div></div><span class="count">${cs.length}</span></div>${groupedCards(cs)}</section>`}).join('')}</div><div class="actions" style="margin-top:8px"><button class="btn" onclick="newStage('${p.id}')">+ Колонка</button></div></section>`}
function profitSummary(pid){const sums={mailing:0,dmitry_base:0,not_set:0};state.cases.filter(c=>c.legal_pipeline_id===pid&&c.profit!==null&&c.profit!==undefined).forEach(c=>sums[c.source||'not_set']+=Number(c.profit)||0);return `<div class="profit-summary" style="margin:0 0 12px"><div class="profit-item"><span class="card-sub">с рассылок</span><strong>${fmtMoney(sums.mailing)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">база клиентов Дмитрия</span><strong>${fmtMoney(sums.dmitry_base)||'0 ₽'}</strong></div><div class="profit-item"><span class="card-sub">не установлено</span><strong>${fmtMoney(sums.not_set)||'0 ₽'}</strong></div></div>`}
function groupColor(g){return g?.color||GROUP_COLORS[Math.abs(hashCode(g?.id||''))%GROUP_COLORS.length]}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h}
function groupedCards(cs){const groups={},ungrouped=[];cs.forEach(c=>c.group_id?(groups[c.group_id]??=[]).push(c):ungrouped.push(c));let html='';Object.entries(groups).sort((a,b)=>String(a[1][0].created_at).localeCompare(String(b[1][0].created_at))).forEach(([gid,items])=>{const g=state.groups.find(x=>x.id===gid);html+=`<div class="group" style="--group-color:${groupColor(g)}"><div class="group-head"><div class="group-label"><span class="group-dot"></span><strong>${esc(g?.name||'Группа')}</strong></div><button class="btn small" onclick="event.stopPropagation();openGroup('${gid}')">Группа</button></div><div class="group-grid">${items.map(caseCard).join('')}</div></div>`});html+=ungrouped.map(caseCard).join('');return html||'<div class="empty">Пусто</div>'}

function renderTasks(main){const now=state.calendarMonth||new Date(todayKey()+'T00:00:00'),y=now.getFullYear(),m=now.getMonth();if(!state.taskDate)state.taskDate=todayKey();const days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),offset=(first+6)%7;let cells='';for(let i=0;i<offset;i++)cells+=`<div></div>`;for(let d=1;d<=days;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,count=state.tasks.filter(t=>t.due_date===k).length;cells+=`<button class="day ${k===state.taskDate?'selected':''} ${k===todayKey()?'today':''}" onclick="selectTaskDate('${k}')"><div class="day-num">${d}</div>${count?`<div class="day-count">${count} ${count===1?'задача':count<5?'задачи':'задач'}</div>`:''}</button>`}const selectedTasks=state.tasks.filter(t=>t.due_date===state.taskDate);main.innerHTML=header('Задачи',`<button class="btn primary" onclick="newTask('${state.taskDate}')">+ Задача</button>`)+`<div class="calendar"><div class="calendar-head"><button class="btn small" onclick="shiftMonth(-1)">‹</button><strong>${now.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</strong><button class="btn small" onclick="shiftMonth(1)">›</button></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div><div class="section"><h3>${fmtDate(state.taskDate)}</h3>${selectedTasks.length?taskListHtml(selectedTasks):'<div class="empty">На эту дату задач нет.</div>'}</div>`}

async function reload(){try{const [{data:p,error:pe},{data:s,error:se},{data:o,error:oe},{data:c,error:ce},{data:g,error:ge},{data:t,error:te}]=await Promise.all([sb.from('crm_pipelines').select('*').eq('active',true).order('sort_order'),sb.from('crm_pipeline_stages').select('*').eq('active',true).order('sort_order'),sb.from('crm_organizations').select('*').is('deleted_at',null).order('created_at',{ascending:false}),sb.from('crm_cases').select('*').is('deleted_at',null).order('created_at',{ascending:false}),sb.from('crm_case_groups').select('*').order('created_at',{ascending:false}),sb.from('crm_tasks').select('*').order('due_date').order('due_time')]);for(const e of [pe,se,oe,ce,ge,te])if(e)throw e;state.pipelines=p||[];state.stages=s||[];state.orgs=o||[];state.cases=c||[];state.groups=g||[];state.tasks=t||[];await assignMissingGroupColors();shell()}catch(e){console.error(e);showFatal(e)}}
async function assignMissingGroupColors(){if(groupColorSaving)return;const missing=state.groups.filter(g=>!g.color);if(!missing.length)return;groupColorSaving=true;try{const used=new Set(state.groups.map(g=>g.color).filter(Boolean));for(const g of missing){const color=GROUP_COLORS.find(c=>!used.has(c));if(!color)break;const {error}=await sb.from('crm_case_groups').update({color}).eq('id',g.id);if(!error){g.color=color;used.add(color)}}}finally{groupColorSaving=false}}

async function moveCase(id,stage){const {error}=await sb.from('crm_cases').update({legal_stage_id:stage,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{await reload();closeModal()}}
function editCase(id){const c=state.cases.find(x=>x.id===id);if(!c)return;const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===c.organization_id?'selected':''}>${esc(o.name)}</option>`).join('');modal(`<div class="modal-head"><h2>Редактировать дело</h2><button class="close" onclick="closeModal()">×</button></div><form id="ec" class="grid" style="margin-top:16px"><div class="field full"><label>Название</label><input name="title" value="${esc(c.title)}" required></div><div class="field full"><label>Организация</label><select id="ecOrg" name="organization_id" onchange="filterGroupsForOrg(this.value,'ecGroup')"><option value="">Не указана</option>${orgOptions}</select></div><div class="field full"><label>Группа</label><select id="ecGroup" name="group_id"><option value="">Без группы</option></select></div><div class="field"><label>Должник</label><input name="debtor_name" value="${esc(c.debtor_name||'')}"></div><div class="field"><label>Идентификатор</label><input name="debtor_identifier" value="${esc(c.debtor_identifier||'')}"></div><div class="field"><label>Прибыль</label><input name="profit" type="number" step="0.01" value="${esc(c.profit??'')}"></div><div class="field full"><label>Откуда пришёл</label><div id="ecSource" data-value="${c.source||'not_set'}">${sourceButtons(c.source||'not_set')}</div></div><div class="field full"><label>Заметки</label><textarea name="notes">${esc(c.notes||'')}</textarea></div><div class="field full"><button class="btn primary">Сохранить</button></div></form>`);filterGroupsForOrg(c.organization_id||'','ecGroup');document.getElementById('ecGroup').value=c.group_id||'';document.getElementById('ec').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),gid=f.get('group_id')||null,group=gid?state.groups.find(g=>g.id===gid):null;if(group&&group.organization_id!==f.get('organization_id')){toast('Группа принадлежит другой организации');return}const {error}=await sb.from('crm_cases').update({title:f.get('title'),organization_id:f.get('organization_id')||null,group_id:gid,debtor_name:f.get('debtor_name')||null,debtor_identifier:f.get('debtor_identifier')||null,profit:f.get('profit')!==''?Number(f.get('profit')):null,source:document.getElementById('ecSource').dataset.value,notes:f.get('notes')||null,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{closeModal();await reload();toast('Сохранено')}}}
function openGroup(id){const g=state.groups.find(x=>x.id===id),cs=state.cases.filter(c=>c.group_id===id),available=state.cases.filter(c=>c.organization_id===g?.organization_id&&!c.group_id);modal(`<div class="modal-head"><div><h2>${esc(g?.name||'Группа')}</h2><div class="card-sub">${cs.length} самостоятельных дел · цвет группы закреплён</div></div><button class="close" onclick="closeModal()">×</button></div><div class="section"><h3>Дела группы</h3><div class="multi">${cs.map(c=>`<button class="btn small" onclick="openCase('${c.id}')">${esc(c.title)}</button>`).join('')||'<span class="card-sub">Пока нет карточек.</span>'}</div></div><div class="section"><h3>Добавить карточки этой организации</h3>${available.length?`<div id="groupAddList">${available.map(c=>`<label style="display:flex;gap:8px;align-items:center;padding:7px 0"><input type="checkbox" value="${c.id}"> ${esc(c.title)}</label>`).join('')}</div><button class="btn primary" style="margin-top:8px" onclick="addSelectedToGroup('${id}')">Добавить выбранные</button>`:'<div class="card-sub">Свободных карточек этой организации нет.</div>'}</div><div class="section"><button class="btn" onclick="newCaseForGroup('${id}')">Новое дело сразу в группу</button></div>`)}
async function addSelectedToGroup(groupId){const ids=[...document.querySelectorAll('#groupAddList input:checked')].map(x=>x.value);if(!ids.length){toast('Выберите карточки');return}const g=state.groups.find(x=>x.id===groupId);const valid=state.cases.filter(c=>ids.includes(c.id)&&c.organization_id===g.organization_id);if(valid.length!==ids.length){toast('В группу можно добавить только карточки её организации');return}const {error}=await sb.from('crm_cases').update({group_id:groupId,updated_at:new Date().toISOString()}).in('id',ids);if(error)toast(error.message);else{await reload();closeModal();toast(`Добавлено: ${ids.length}`)}}
function newGroupForOrg(orgId){newGroup(orgId)}
function newGroup(defaultOrg=''){const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===defaultOrg?'selected':''}>${esc(o.name)}</option>`).join('');modal(`<div class="modal-head"><div><h2>Новая группа дел</h2><div class="card-sub">Группа связывает самостоятельные карточки одной организации.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="groupForm" style="margin-top:16px"><div class="field"><label>Организация</label><select name="organization_id" required><option value="">Выберите организацию</option>${orgOptions}</select></div><div class="field" style="margin-top:10px"><label>Название группы</label><input name="name" required placeholder="Например: Пакет УК №12"></div><button class="btn primary" style="margin-top:12px">Создать группу</button></form>`);document.getElementById('groupForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),used=new Set(state.groups.map(g=>g.color).filter(Boolean)),color=GROUP_COLORS.find(c=>!used.has(c));if(!color){toast('Свободных цветов групп больше нет');return}const {error}=await sb.from('crm_case_groups').insert({name:f.get('name').trim(),organization_id:f.get('organization_id'),created_by:state.user.id,color});if(error)toast(error.message);else{closeModal();await reload();toast('Группа создана')}}}
function newCaseForGroup(groupId){const g=state.groups.find(x=>x.id===groupId);newCaseWithDefaults(g?.organization_id||'',groupId)}
function newCaseWithDefaults(orgId,groupId){const ps=pipelineFor('case');if(!ps.length){toast('Сначала создайте юридическую воронку');return}const p=(state.legalPipelineView&&state.legalPipelineView!=='all'?ps.find(x=>x.id===state.legalPipelineView):ps[0])||ps[0],s=stagesFor(p.id)[0],orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===orgId?'selected':''}>${esc(o.name)}</option>`).join('');modal(`<div class="modal-head"><h2>Новое дело</h2><button class="close" onclick="closeModal()">×</button></div><form id="caseForm2" class="grid" style="margin-top:16px"><div class="field full"><label>Название дела</label><input name="title" required></div><div class="field full"><label>Организация</label><select id="newCaseOrg" name="organization_id" onchange="filterGroupsForOrg(this.value,'newCaseGroup')">${orgOptions}</select></div><div class="field full"><label>Группа</label><select id="newCaseGroup" name="group_id"></select></div><div class="field"><label>Должник</label><input name="debtor_name"></div><div class="field"><label>Прибыль</label><input name="profit" type="number" step="0.01"></div><div class="field full"><button class="btn primary">Создать</button></div></form>`);filterGroupsForOrg(orgId,'newCaseGroup');document.getElementById('newCaseGroup').value=groupId||'';document.getElementById('caseForm2').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_cases').insert({title:f.get('title'),organization_id:f.get('organization_id')||null,group_id:f.get('group_id')||null,debtor_name:f.get('debtor_name')||null,profit:f.get('profit')!==''?Number(f.get('profit')):null,source:'not_set',owner_id:state.user.id,legal_pipeline_id:p.id,legal_stage_id:s?.id||null});if(error)toast(error.message);else{closeModal();await reload();toast('Дело создано')}}}
async function newLegalPipeline(){const name=prompt('Название юридической воронки');if(!name?.trim())return;const {data,error}=await sb.from('crm_pipelines').insert({name:name.trim(),entity_type:'case',is_system:false,sort_order:state.pipelines.length,created_by:state.user.id}).select().single();if(error)toast(error.message);else{state.legalPipelineView=data.id;await reload();toast('Воронка создана')}}
async function renamePipeline(id){const p=state.pipelines.find(x=>x.id===id),name=prompt('Новое название',p?.name);if(!name?.trim())return;const {error}=await sb.from('crm_pipelines').update({name:name.trim()}).eq('id',id);if(error)toast(error.message);else await reload()}
async function deletePipeline(id){const p=state.pipelines.find(x=>x.id===id);if(!p)return;if(p.is_system){toast('Системную воронку удалить нельзя');return}if(!confirm(`Удалить воронку «${p.name}»? Дела не удаляются.`))return;if(state.cases.some(c=>c.legal_pipeline_id===id)){toast('В воронке есть дела. Сначала перенесите их в другую воронку.');return}const {error}=await sb.from('crm_pipelines').update({active:false}).eq('id',id);if(error)toast(error.message);else{state.legalPipelineView='all';await reload()}}
async function newStage(pid){const name=prompt('Название новой колонки');if(!name?.trim())return;const max=Math.max(-1,...stagesFor(pid).map(s=>s.sort_order));const {error}=await sb.from('crm_pipeline_stages').insert({pipeline_id:pid,name:name.trim(),sort_order:max+1});if(error)toast(error.message);else await reload()}
async function renameStage(id){const s=state.stages.find(x=>x.id===id),name=prompt('Новое название колонки',s?.name);if(!name?.trim())return;const {error}=await sb.from('crm_pipeline_stages').update({name:name.trim()}).eq('id',id);if(error)toast(error.message);else await reload()}
async function deleteStage(id){const s=state.stages.find(x=>x.id===id);if(!s)return;const used=state.cases.filter(c=>c.legal_stage_id===id);if(used.length){const targets=stagesFor(s.pipeline_id).filter(x=>x.id!==id);if(!targets.length){toast('Нельзя удалить единственную колонку с делами');return}const options=targets.map((x,i)=>`${i+1}. ${x.name}`).join('\n');const pick=prompt(`В колонке есть ${used.length} дел. Куда их перенести?\n${options}\nВведите номер`),target=targets[Number(pick)-1];if(!target)return;const {error:moveError}=await sb.from('crm_cases').update({legal_stage_id:target.id,updated_at:new Date().toISOString()}).eq('legal_stage_id',id);if(moveError){toast(moveError.message);return}}const {error}=await sb.from('crm_pipeline_stages').update({active:false}).eq('id',id);if(error)toast(error.message);else await reload()}
function newTask(date=todayKey(),orgId='',caseId=''){const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===orgId?'selected':''}>${esc(o.name)}</option>`).join('');const caseOptions=state.cases.map(c=>`<option value="${c.id}" ${c.id===caseId?'selected':''}>${esc(c.title)}</option>`).join('');modal(`<div class="modal-head"><h2>Новая задача</h2><button class="close" onclick="closeModal()">×</button></div><form id="taskForm" class="grid" style="margin-top:16px"><div class="field full"><label>Задача</label><input name="title" required></div><div class="field"><label>Дата</label><input name="due_date" type="date" value="${esc(date||todayKey())}"></div><div class="field"><label>Время</label><input name="due_time" type="time"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Дело</label><select name="case_id"><option value="">Не указано</option>${caseOptions}</select></div><div class="field full"><label>Заметка</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary">Создать</button></div></form>`);document.getElementById('taskForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_tasks').insert({title:f.get('title'),due_date:f.get('due_date')||null,due_time:f.get('due_time')||null,organization_id:f.get('organization_id')||null,case_id:f.get('case_id')||null,notes:f.get('notes')||null,owner_id:state.user.id});if(error)toast(error.message);else{closeModal();await reload();toast('Задача создана')}}}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const orgOptions=state.orgs.map(o=>`<option value="${o.id}" ${o.id===t.organization_id?'selected':''}>${esc(o.name)}</option>`).join('');const caseOptions=state.cases.map(c=>`<option value="${c.id}" ${c.id===t.case_id?'selected':''}>${esc(c.title)}</option>`).join('');modal(`<div class="modal-head"><h2>Редактировать задачу</h2><button class="close" onclick="closeModal()">×</button></div><form id="editTaskForm" class="grid" style="margin-top:16px"><div class="field full"><label>Задача</label><input name="title" value="${esc(t.title)}" required></div><div class="field"><label>Дата</label><input name="due_date" type="date" value="${esc(t.due_date||'')}"></div><div class="field"><label>Время</label><input name="due_time" type="time" value="${esc(t.due_time||'')}"></div><div class="field"><label>Организация</label><select name="organization_id"><option value="">Не указана</option>${orgOptions}</select></div><div class="field"><label>Дело</label><select name="case_id"><option value="">Не указано</option>${caseOptions}</select></div><div class="field full"><label>Заметка</label><textarea name="notes">${esc(t.notes||'')}</textarea></div><div class="field full"><button class="btn primary">Сохранить</button></div></form>`);document.getElementById('editTaskForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('crm_tasks').update({title:f.get('title'),due_date:f.get('due_date')||null,due_time:f.get('due_time')||null,organization_id:f.get('organization_id')||null,case_id:f.get('case_id')||null,notes:f.get('notes')||null,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{closeModal();await reload();toast('Сохранено')}}}
async function toggleTask(id,done){const {error}=await sb.from('crm_tasks').update({completed:done,completed_at:done?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return}await reload()}
async function startApp(){if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ok=await ensureMember();if(!ok){toast('Нет доступа к CRM');await sb.auth.signOut();showLogin();return}const {data:{session}}=await sb.auth.getSession();state.user=session?.user||state.user;if(!state.user){showLogin();return}await reload()}
async function boot(){state.theme=localStorage.getItem('pravodom_theme')||'system';applyTheme();sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:{session}}=await sb.auth.getSession();if(session){try{const ok=await ensureMember();if(!ok){toast('Нет доступа к CRM');await sb.auth.signOut();showLogin();return}state.user=session.user;await reload()}catch(e){console.error(e);showFatal(e)}}else showLogin();sb.channel('pravodom-live').on('postgres_changes',{event:'*',schema:'public',table:'crm_pipelines'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_pipeline_stages'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_organizations'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_cases'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_case_groups'},()=>reload()).on('postgres_changes',{event:'*',schema:'public',table:'crm_tasks'},()=>reload()).subscribe();sb.auth.onAuthStateChange(async(_e,s)=>{if(s?.user&&!state.user){state.user=s.user;try{if(await ensureMember())await reload()}catch(e){showFatal(e)}}else if(!s){state.user=null;showLogin()}})}
boot();
</script>
